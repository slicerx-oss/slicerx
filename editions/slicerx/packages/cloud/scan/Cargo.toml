[package]
name = "sx-upload-scan"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
crc32fast = "=1.5.2"
miniz_oxide = "=0.9.1"
quick-xml = "=0.42.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sx-core.workspace = true
sx3mf.workspace = true
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "time"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

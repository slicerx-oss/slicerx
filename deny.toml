# cargo-deny policy. SlicerX code is Apache-2.0; the AGPL entries cover sx-profiles (packages/profiles).
# Engine dependencies stay permissive (docs/licensing.md).
[licenses]
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0", # webpki-roots, webpki-root-certs (Mozilla CA bundle data)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, without a version.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Reviewed 2026-10-02. Each entry says why it is accepted for now.
ignore = [
  # rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (Bambu printer MQTT on the LAN). The driver
  # accepts the printers' self-signed certificates (packages/connect/src/tls.rs), so CA name constraint
  # and CRL checks never run on that path.
  # Remove when rumqttc moves to rustls-webpki 0.103.
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  # 2026-10-20: RUSTSEC-2026-0382 (distrusted emSign intermediates) on that same 0.102.8 copy. rumqttc
  # 0.25.1, the latest, uses it only for an error type (src/tls.rs); certificates are checked by our own
  # rustls 0.23 verifiers, whose rustls-webpki is 0.103.16 with the fix. Same removal condition.
  "RUSTSEC-2026-0382",
  # rustls-pemfile (unmaintained) is pulled in by rumqttc. Same removal condition.
  "RUSTSEC-2025-0134",
  # proc-macro-error (unmaintained) is a build-time dependency of a macro crate, not shipped code.
  "RUSTSEC-2024-0370",
  # zvariant, zbus_names and zvariant_derive (unmaintained, 2026-10-17) were folded into zbus 6. zbus 5 comes
  # in on Linux through the keyring's Secret Service store and the Tauri opener and single-instance plugins,
  # none of which has moved to zbus 6 yet. Remove when they do.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#282a36" />
    <title>SlicerX</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The page's background from the last visit (src/main.tsx keeps it), on the root before anything paints, so the
      // first frame is the app's theme and not the dark default. The app's theme takes over the same token.
      try {
        var bg = localStorage.getItem('slicerx.pageBackground')
        if (/^#[0-9a-f]{6}$/i.test(bg || '')) {
          var root = document.documentElement.style
          root.setProperty('--ink-0', bg)
          root.backgroundColor = 'var(--ink-0)'
          root.colorScheme = parseInt(bg.slice(1, 3), 16) + parseInt(bg.slice(3, 5), 16) + parseInt(bg.slice(5, 7), 16) > 384 ? 'light' : 'dark'
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A startup script that fails to download (a dropped connection, a deploy that replaced it) leaves an empty page,
      // and the browser keeps the failure: only a reload fetches it again. Once, not again within 30 s. After the app
      // is up, the parts it loads later are its own to handle.
      addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT' || document.documentElement.hasAttribute('data-sx-ready')) return
        try {
          if (Date.now() - Number(sessionStorage.getItem('sx-boot-reload') || 0) < 30000) return
          sessionStorage.setItem('sx-boot-reload', String(Date.now()))
        } catch (_) {
          return
        }
        location.reload()
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "slicerx-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "slicerx"
path = "src/main.rs"

# Optional features: each edition feature can be left out.
# `cargo build -p slicerx-desktop --no-default-features` builds the base app.
[features]
default = ["store", "pilot", "connect", "cloud"]
store = []
pilot = ["dep:sx-llm", "dep:sx-permit", "dep:futures", "dep:base64", "dep:keyring", "dep:zip"]
connect = ["dep:sx-connect", "dep:sx-permit", "dep:sx-link", "dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:keyring", "dep:chacha20poly1305", "dep:getrandom"]
cloud = []
# Dev and test builds only: the agent bridge (src/agent_bridge, docs/agent-bridge.md). Never in `default`, never in a
# release build: apps/desktop/release/check-agent-bridge.mjs fails a release binary or feature set that has it.
agent-bridge = ["dep:getrandom", "dep:base64", "dep:libc", "dep:webkit2gtk", "dep:cairo-rs", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-web-kit", "dep:block2"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
sx-core.workspace = true
sx-connect = { workspace = true, optional = true }
sx-llm = { workspace = true, optional = true }
keyring = { version = "=4.2.0", optional = true }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
futures = { version = "=0.3.34", optional = true }
base64 = { version = "=0.23.1", optional = true }
sx-permit = { workspace = true, optional = true }
sx-link = { path = "../../../packages/connect/link", optional = true }
tokio = { version = "=1.53.1", features = ["sync", "time"], optional = true }
tokio-tungstenite = { version = "=0.30.0", optional = true }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
# In-app updates (src/updates.rs). No zip: the Windows installers update as they are, not zipped.
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = "=1.0.104"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# Opens a menu by its access key (menu::menu_key), reads the GPU for local AI (localai.rs) and seals printer codes the
# keychain refuses with DPAPI (vault.rs); the agent bridge's screenshots read a COM stream (agent_bridge/shot.rs) and
# its files get an owner-only access list (agent_bridge/private.rs). The same version tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dxgi", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading"] }
# Turns off the web view's browser keys (crash::disable_browser_keys) and captures the agent bridge's screenshots. The
# same version tauri uses.
webview2-com = "=0.39.1"

# The agent bridge's private export folder and files (src/agent_bridge/private.rs) on macOS and Linux. The same version
# the rest of the tree uses.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.189", optional = true }

# The agent bridge's screenshots (src/agent_bridge/shot.rs) on macOS and Linux, the same versions wry uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"], optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"], optional = true }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"], optional = true }
block2 = { version = "=0.6.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", optional = true }
cairo-rs = { version = "=0.18.5", optional = true }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util"] }
# The updater end to end against a local feed (tests/updater.rs) runs on Tauri's mock runtime.
tauri = { version = "=2.12.0", features = ["test"] }

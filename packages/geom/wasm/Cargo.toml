[package]
name = "sx-geom-wasm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "sx-geom for a browser Web Worker: one JSON call entry over a plain C ABI"

[lib]
crate-type = ["cdylib", "rlib"]

# Exports use #[unsafe(no_mangle)], which the workspace's forbid(unsafe_code)
# rejects, so this crate sets its own lints. No unsafe blocks are used.
[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
sx-geom = { path = "..", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"

# The engine's optional parts, all on by default; scripts/build.sh takes SX_GEOM_FEATURES to pick some.
[features]
default = ["cad", "holes", "threads", "shell", "text", "svg", "nest", "calib", "hollow"]
cad = ["sx-geom/cad"]
holes = ["sx-geom/holes"]
threads = ["sx-geom/threads"]
shell = ["sx-geom/shell"]
text = ["sx-geom/text"]
svg = ["sx-geom/svg"]
nest = ["sx-geom/nest"]
calib = ["sx-geom/calib"]
hollow = ["sx-geom/hollow"]

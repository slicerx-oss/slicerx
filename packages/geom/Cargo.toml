[package]
name = "sx-geom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Mesh operations for SlicerX: cut, split to fit, repair, orientation, hollowing, emboss, calibration models, resume from layer"
repository = "https://github.com/slicerx-oss/slicerx"
homepage = "https://slicerx.app"
documentation = "https://docs.rs/sx-geom"
readme = "README.md"
keywords = ["mesh", "3d-printing", "geometry", "stl", "repair"]
categories = ["graphics", "mathematics", "wasm"]
include = ["/src/**", "/fonts/**", "/README.md", "/LICENSE-APACHE", "/NOTICE"]

[lints]
workspace = true

[[bin]]
name = "sx-geom"
path = "src/bin/sx-geom.rs"

[[test]]
name = "nest_bench"
required-features = ["nest"]

[[example]]
name = "nest_bench"
required-features = ["nest"]

[[test]]
name = "timing"
required-features = ["calib", "hollow"]

[dependencies]
i_overlay = { package = "sx-i-overlay", path = "../vendor/i_overlay", version = "=9.0.0" }
libm = "=0.2.16"
manifold-rust = { version = "=0.15.0", default-features = false }
miniz_oxide = "=0.9.1"
# A fast hasher for the mesh code's lookup maps (src/mesh.rs, repair.rs, import/): SipHash costs several times as much
# per key, most of all in WebAssembly. Already in the lockfile through other crates; Apache-2.0 OR MIT.
rustc-hash = "=2.1.3"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "opentype-layout"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"

# The tools a build carries. Every one is on by default; an edition or an integrator leaves out what it does not
# offer (docs/cad-engine.md, section 2). Booleans, arrays, measure, cut, split, repair, import, orient, emboss,
# simplify, fit check and print rescue are always there.
[features]
default = ["cad", "holes", "threads", "shell", "text", "svg", "nest", "calib", "hollow"]
# The modeling tools: the face shape tool, free sketch, push and pull, fillet and chamfer, kept dimensions, and the
# faces that make them work (found on meshes without them, and sent in the JSON).
cad = ["text", "svg"]
# The hole tool.
holes = ["cad"]
# ISO metric threads on a hole, boss or rod; only in the full engine the app loads when a call needs it.
threads = ["holes"]
# A body hollowed with faces left open (exact for flat bodies); only in the full engine.
shell = ["cad", "hollow"]
# TrueType and OpenType text bodies and outlines, with the built-in font.
text = ["dep:ttf-parser"]
# SVG outlines as bodies.
svg = []
# Arrange and fill the bed with true shapes.
nest = []
# Calibration models and the pressure advance pattern.
calib = []
# Hollow with drain holes.
hollow = []

[package]
name = "sx-connect"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# AES-128-CBC for the credentials an Anycubic printer hands out in LAN Mode.
aes = "=0.9.3"
async-trait = "=0.1.92"
base64 = "=0.22.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
futures = "=0.3.34"
getrandom = "=0.4.3"
# The computer's network interfaces, so discovery asks on each network (see src/netif.rs).
if-addrs = "=0.15.0"
# Printer credentials live in the OS keychain; v1 picks the backend per OS.
keyring = "=4.2.0"
md-5 = "=0.11.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "multipart", "query", "rustls-no-provider", "stream"] }
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
# Discovery sockets that share a port with Bambu Studio, and pick the interface multicast leaves on.
socket2 = { version = "=0.6.5", features = ["all"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "=0.30.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process"] }

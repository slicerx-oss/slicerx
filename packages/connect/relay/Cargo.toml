[package]
name = "sx-relay"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "The hosted pairing relay: forwards sealed frames between opaque routes, with quotas"

[lints]
workspace = true

[dependencies]
base64 = "=0.23.1"
futures = "=0.3.34"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }
tokio-tungstenite = "=0.30.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "test-util"] }

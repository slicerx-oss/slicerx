[package]
name = "sx-stills"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "One still picture from an H.264 key frame, through the operating system's decoder"

# The only crate in the workspace allowed `unsafe`: the OS video decoders (VideoToolbox, Media
# Foundation) are C APIs. Every unsafe block carries a SAFETY comment. The public API is safe.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
sha2 = "=0.11.0"

# Cisco's prebuilt OpenH264, loaded at run time after a SHA-256 check (Linux, and as a fallback on
# other Unix systems). Built without the OpenH264 sources.
[target.'cfg(not(windows))'.dependencies]
openh264 = { version = "=0.9.8", default-features = false, features = ["libloading"] }

# Media Foundation's H.264 decoder, which ships with Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[dev-dependencies]
# Tests only: the source build encodes test frames. It is never part of the shipped decoder.
openh264 = { version = "=0.9.8" }

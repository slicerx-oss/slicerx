[package]
name = "sx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Exports use #[unsafe(no_mangle)], which the workspace's forbid(unsafe_code)
# rejects, so this crate sets its own lints. No unsafe blocks are used.
[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
sx-core = { path = "..", default-features = false }
serde_json = "=1.0.151"
# Provides the random source the skip list in boostvoronoi asks for, see .cargo/config.toml.
getrandom = "=0.3.4"

# libm's square root (inside hypot and the distance math), floor, ceil and trunc run as the module's own float
# instructions instead of in software. Both are exact, so the results are the same bits. The feature needs
# nightly, which build-wasm.sh unlocks for the wasm build only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = { version = "=0.2.16", features = ["unstable-intrinsics"] }

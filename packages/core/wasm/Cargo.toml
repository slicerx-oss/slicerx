[package]
name = "sx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Exports use #[unsafe(no_mangle)], which the workspace's forbid(unsafe_code)
# rejects, so this crate sets its own lints. No unsafe blocks are used.
[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
sx-core = { path = "..", default-features = false }
serde_json = "=1.0.151"
# Provides the random source the skip list in boostvoronoi asks for, see .cargo/config.toml.
getrandom = "=0.3.4"

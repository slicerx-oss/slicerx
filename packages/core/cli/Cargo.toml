[package]
name = "sx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sx"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The makers' stock custom G-code fingerprints (packages/settings/profiles/stock-gcode.json), embedded so a
# project's unchanged stock text runs as trusted. Native only: the browser build (packages/core/wasm) does not
# use this crate.
default = ["stock-gcode"]
stock-gcode = ["dep:sha2"]

[dependencies]
sx-core.workspace = true
# jemalloc, with its page decay per operating system (packages/core/alloc).
sx-alloc.workspace = true
# The toolhead rewrite of the printer bridge, for `sx remap-toolheads` on a file with no printer.
sx-connect.workspace = true
rayon = "=1.12.0"
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false, optional = true }


[dev-dependencies]
# The tests read PrusaSlicer projects' settings out of their 3MF.
miniz_oxide = "=0.9.1"
sha2 = { version = "=0.11.0", default-features = false }

[build-dependencies]
serde_json = "=1.0.151"

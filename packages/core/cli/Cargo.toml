[package]
name = "sx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sx"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The makers' stock custom G-code fingerprints (packages/settings/profiles/stock-gcode.json), embedded so a
# project's unchanged stock text runs as trusted. Native only: the browser build (packages/core/wasm) does not
# use this crate.
default = ["stock-gcode"]
stock-gcode = ["dep:sha2"]

[dependencies]
sx-core.workspace = true
rayon = "=1.12.0"
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false, optional = true }

# jemalloc returns the memory a slice frees to the system after a short decay, where the system allocators keep large
# freed blocks cached. Its page decay times are set at build time in .cargo/config.toml. It does not build with MSVC,
# so Windows keeps the system allocator.
[target.'cfg(all(not(target_env = "msvc"), not(target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = "=0.7.0"

[build-dependencies]
serde_json = "=1.0.151"

[package]
name = "sx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The SlicerX slicing engine: 3MF and STL in, G-code with time and filament estimates and preview buffers out, natively and in WebAssembly"
repository = "https://github.com/slicerx-oss/slicerx"
homepage = "https://slicerx.app"
documentation = "https://docs.rs/sx-core"
readme = "README.md"
keywords = ["slicer", "3d-printing", "gcode", "3mf", "stl"]
categories = ["graphics", "rendering::data-formats", "science", "wasm"]
include = ["/src/**", "/data/**", "/build.rs", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/NOTICE"]

[lints]
workspace = true

[features]
default = ["parallel", "import"]
# Per-layer parallelism on rayon. The WASM build turns it off and shards in
# Web Workers instead.
parallel = ["dep:rayon"]
# OBJ and AMF loading through sx-geom. The browser build leaves it out and loads
# those formats with the separate sx-geom module.
import = ["dep:sx-geom"]

[dependencies]
sx-geom = { path = "../geom", version = "=0.1.0", optional = true }
# Forks published with SlicerX; each keeps the original library name. See packages/vendor/*/SOURCE.md.
i_overlay = { package = "sx-i-overlay", path = "../vendor/i_overlay", version = "=9.0.0" }
# The time estimate takes its trigonometry from here so native and WASM builds round alike.
libm = "=0.2.16"
boostvoronoi = { package = "sx-boostvoronoi", path = "../vendor/boostvoronoi", version = "=0.12.1", default-features = false }
miniz_oxide = "=0.9.1"
rayon = { version = "=1.12.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The output hash. 0.11 takes the CPU's SHA-256 instructions where it has them (ARMv8 SHA2 or x86 SHA, found at run
# time); 0.10 needs its `asm` feature for that.
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.21"

[build-dependencies]
serde_json = "=1.0.151"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Small thread pools for the tests that check the parallel stages cannot hang.
rayon = "=1.12.0"

[[bench]]
name = "slice"
harness = false

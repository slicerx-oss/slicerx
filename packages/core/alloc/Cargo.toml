[package]
name = "sx-alloc"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "The memory allocator of the sx command line tool and the cloud service: jemalloc, with its page decay per operating system"

# Its own lints because of one `unsafe` attribute: the exported symbol jemalloc reads its options from. It carries a
# SAFETY comment; nothing else here is unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"

# jemalloc returns the memory a slice frees to the system after a short decay, where the system allocators keep large
# freed blocks cached. It does not build with MSVC, so Windows keeps the system allocator.
[target.'cfg(all(not(target_env = "msvc"), not(target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = "=0.7.0"

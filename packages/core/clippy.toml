# The platform math library and WebAssembly's round differently in the last bit, which changed
# G-code between the native and browser builds. The core takes these functions from `fm::Fm`
# (the `libm` crate) instead.
# Values worked out once go through `crate::par` (see the rule at the top of src/par.rs): an initializer
# that runs parallel work while a parallel job waits on it can hang the thread pool.
disallowed-methods = [
  { path = "f64::sin", reason = "use the `m_sin` method of `crate::fm::Fm`, which rounds the same on every target" },
  { path = "f64::cos", reason = "use the `m_cos` method of `crate::fm::Fm`, which rounds the same on every target" },
  { path = "f64::sin_cos", reason = "use the `m_sin_cos` method of `crate::fm::Fm`, which rounds the same on every target" },

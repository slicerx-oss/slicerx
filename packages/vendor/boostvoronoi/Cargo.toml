[package]
name = "sx-boostvoronoi"
version = "0.12.1"
edition = "2024"
rust-version = "1.87.0"
authors = ["eadf <lacklustr@protonmail.com>", "The SlicerX contributors"]
description = "Fork of boostvoronoi 0.12.1 (Boost voronoi ported to Rust) for SlicerX: faster exact integer products with the same results, on the deterministic sx-cpp-map"
license = "BSL-1.0"
repository = "https://github.com/slicerx-oss/slicerx"
homepage = "https://github.com/slicerx-oss/slicerx/tree/main/packages/vendor/boostvoronoi"
readme = "README.md"
keywords = ["voronoi", "geometry", "fortune", "segment"]
categories = ["algorithms", "graphics", "mathematics"]
include = ["/src/**", "/README.md", "/SOURCE.md", "/LICENSE"]

[features]
ce_corruption_check = []
console_debug = []
cpp_console_debug = ["cpp_map/console_debug"]
# Integrations of the original crate, left out here (their code is never compiled).
cgmath = []
geo = []
glam = []
mint = []
nalgebra = []
serde = []

[lib]
name = "boostvoronoi"
path = "src/lib.rs"

[dependencies]
approx = "0.5.1"
# sx-cpp-map: cpp_map with node levels from a fixed seed, so the diagram repeats from run to run.
cpp_map = { package = "sx-cpp-map", version = "=0.2.0", path = "../cpp_map" }
libm = "0.2.15"
num-traits = "0.2.19"
ordered-float = "5.1.0"
rustc-hash = "2.1"
smallvec = "1.15.1"
thiserror = "2.0.17"
vob = "3.0.6"

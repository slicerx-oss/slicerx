[package]
name = "sx-i-overlay"
version = "9.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nail Sharipov <nailxsharipov@gmail.com>", "The SlicerX contributors"]
description = "Fork of i_overlay 9.0.0 (boolean operations for 2D polygons) for SlicerX: a faster list split and fill sweep with the same results"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slicerx-oss/slicerx"
homepage = "https://github.com/slicerx-oss/slicerx/tree/main/packages/vendor/i_overlay"
readme = "README.md"
keywords = ["polygon", "boolean", "overlay", "clipping", "geometry"]
categories = ["algorithms", "graphics", "mathematics"]
include = ["/src/**", "/README.md", "/SOURCE.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[features]
allow_multithreading = ["dep:rayon", "i_key_sort/allow_multithreading"]
default = []
glam = ["i_float/glam"]
serde = ["i_float/serde", "i_shape/serde"]
variable_stroke_debug = []

[lib]
name = "i_overlay"
path = "src/lib.rs"

[dependencies]
i_float = "^5.0.0"
i_key_sort = "^0.11.0"
i_shape = "^5.0.0"
i_tree = "^0.19.0"
rayon = { version = "^1.10", optional = true }

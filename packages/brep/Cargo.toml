[package]
name = "sx-brep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "Exact solids for SlicerX's modeling tools on the SMLib kernel (NVIDIA usd-brep, Apache-2.0), behind one JSON call and, with the typed feature, as Rust types"
links = "sx_brep"

# The kernel is C++, so this crate allows `unsafe`: the C call behind the JSON API in src/lib.rs, and with the typed
# feature the bridge in src/kernel.rs, which holds all of that feature's. Every block has a SAFETY comment.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"

[features]
# tests/routines.rs: the kernel routines we replaced, against what the originals gave
routine-probe = []
# The kernel as Rust types (bodies, faces, edges, tessellation), reached through a cxx bridge. Off by default: cxx
# compiles a C++ file of its own even without the kernel, and a plain workspace build needs no C++ compiler.
typed = ["dep:cxx", "dep:cxx-build"]

[dependencies]
cxx = { version = "=1.0.205", optional = true }
serde_json = "=1.0.151"

[build-dependencies]
cc = { version = "=1.5.1", features = ["parallel"] }
cxx-build = { version = "=1.0.205", optional = true }

# the tests of the typed API
[[test]]
name = "typed_bodies"
required-features = ["typed"]

[[test]]
name = "typed_mesh"
required-features = ["typed"]

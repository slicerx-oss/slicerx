name: Feature request
description: Suggest a change or addition
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do now, or do slowly?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen. Sketches and examples from other tools help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Slicing engine
        - App
        - Printers and connectors
        - mimir and the MCP server
        - Model library
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this

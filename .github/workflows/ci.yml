name: ci

# Runs for outside pull requests too, so it holds to this: pull_request (never pull_request_target), no
# secrets, read-only token, and no outside services. The benchmark, the e2e specs that need a real backend
# or sx-link, the integrator sample on pull requests and the release builds run elsewhere (scripts/ci,
# desktop-release.yml).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # the merge queue tests each queued pull request on top of main before it lands
  merge_group:
  # by hand (write access): the integration test parts on a branch, with core and crates on the self-hosted Linux
  # runners as the merge queue runs them, to try a change to that path before it is queued
  workflow_dispatch:
    inputs:
      rust_tests_on_pc:
        description: Run the rust test parts, core and crates on the self-hosted Linux runners
        type: boolean
        default: true

permissions:
  contents: read

# The jobs that run on the project's self-hosted runners in the merge queue start with this check, and repeat it right
# before each step that waits for the machine's heavy lock (eval "$SX_GROUP_CHECK"). GitHub sends no event when it
# drops a merge group, and a run's concurrency group is its own group ref, so a dropped group's jobs kept the runners and
# the lock, oldest first, ahead of the live groups. A dropped (or merged) group's ref, refs/heads/gh-readonly-queue/...,
# is gone, and its result no longer matters: the run is cancelled through the API (actions: write, in those jobs) and
# the job stops here, failing if the cancel has not landed within a minute. Without GH_TOKEN (the re-checks) the job
# just stops, failing. Anything that cannot tell (another event, git or the network failing) carries on, so a live group
# runs exactly as before.
env:
  SX_GROUP_CHECK: |
    if [ "${GITHUB_EVENT_NAME:-}" = merge_group ]; then
      sx_rc=0
      git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" > /dev/null 2>&1 || sx_rc=$?
      if [ "$sx_rc" = 2 ]; then
        echo "::notice title=Dropped merge group::$GITHUB_REF is gone, so this run is cancelled before it takes the heavy lock"
        if [ -n "${GH_TOKEN:-}" ]; then
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" > /dev/null || echo "::warning::could not cancel run $GITHUB_RUN_ID"
          sleep 60
        fi
        exit 1
      fi
    fi

# A cancelled required check recorded after a passing one keeps a pull request out of the merge queue, so the runs of
# one pull request never cancel each other across these cases. Adding full-ci (also right after opening: gh and the web
# both add labels just after the opened event) starts a run beside the opened or pushed one. A run that adds nothing
# (opened with full-ci already on it, so a labeled run follows, or labeled with any other label) skips its jobs; a
# skipped check counts as passed. Each run started by a label, and the opened run that defers to one, has a group of
# its own (its run id): a pull request opened with labels gets one labeled event per label, sometimes two, all in the
# same second, and in a shared group each newer one cancelled the one waiting before it. Those cancelled checks could be
# the newest of their name, so the pull request stayed blocked with every real check passed.
# Each push to main has a group of its own (its commit): in one shared group a newer push replaced the run waiting
# before it, so while the queue merged every few minutes most commits on main had no finished push run, and a release
# from one of them found the checks only a push runs (rust on macOS and Windows) missing. The push jobs no release
# needs (desktop-bridge, heavy-lock) still give way to a newer push, through a job group of their own.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}${{ (github.event.action == 'labeled' || (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && format('-label-{0}', github.run_id) || '' }}
  # Only a pull request's superseded runs are cancelled. A merge queue entry's run is never cut short: the queue rebuilds
  # the same commit on the same ref when an entry is requeued, and a cancelled run's checks there failed the new entry.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    # a duplicate run (the concurrency comment above) skips this, and every job after it
    if: ${{ !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.f.outputs.node }}
      rust: ${{ steps.f.outputs.rust }}
      pgtap: ${{ steps.f.outputs.pgtap }}
      e2e: ${{ steps.f.outputs.e2e }}
      shards: ${{ steps.f.outputs.shards }}
      smoke: ${{ steps.f.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request checks out its merge commit, whose first parent is the base it merges into
          fetch-depth: 2
      - id: f
        env:
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          # The database and browser suites are the slow ones, so a pull request skips them and the merge queue
          # runs them on the queued change. A push to main skips them too: every commit on main comes from the
          # queue, which already ran them on that exact tree. A pull request labeled full-ci runs them when they
          # touch what changed (or this file).
          changed=$(git diff --name-only HEAD^1 HEAD)
          touched() {
            # a run by hand is for the rust test parts only
            case $GITHUB_EVENT_NAME in push | workflow_dispatch) return 1 ;; esac
            [ "$GITHUB_EVENT_NAME" != pull_request ] && return 0
            [ "$FULL_CI" = true ] || return 1
            printf '%s\n' "$changed" | grep -qE "$1"
          }
          touched '^(supabase/|packages/store/|\.github/workflows/ci\.yml$)' && echo "pgtap=true" >> "$GITHUB_OUTPUT" || echo "pgtap=false" >> "$GITHUB_OUTPUT"
          # A pull request that changes the browser suite's own harness (the specs, their config, the printer
          # simulators, the results script) runs the suite without the label: those are the changes whose mistakes
          # otherwise first show up in the merge queue.
          own_e2e() { [ "$GITHUB_EVENT_NAME" = pull_request ] && printf '%s\n' "$changed" | grep -qE '^(apps/web/e2e/|apps/web/playwright\.config\.ts$|packages/connect/mock-printers/|scripts/ci/playwright-results\.mjs$)'; }
          browser='^(apps/web/|packages/(app|ui|core|geom|connect)/|pnpm-lock\.yaml$|scripts/ci/playwright-results\.mjs$|\.github/workflows/ci\.yml$)'
          { touched "$browser" || own_e2e; } && e2e=true || e2e=false
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          # The hosted runners are shared by pull requests and the merge queue, and the full browser suite is 16 jobs.
          # The merge queue runs it as it is. A pull request that runs it (full-ci, or a change to the suite itself)
          # runs it on half as many jobs, each with twice the tests, so every test still runs. Any other pull request
          # that touches the app gets one smoke job instead: a few quick specs that start the app, load the plate and
          # slice, so a change that breaks the start shows before the queue.
          [ "$GITHUB_EVENT_NAME" = pull_request ] && echo "shards=half" >> "$GITHUB_OUTPUT" || echo "shards=full" >> "$GITHUB_OUTPUT"
          smoke=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$e2e" = false ] && printf '%s\n' "$changed" | grep -qE "$browser"; then smoke=true; fi
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  web:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # One retry per failing test; one that passes only on the retry is flaky (scripts/ci/README.md, "Flaky tests"):
      # the reporter annotates it, and the next step fails the job unless scripts/ci/flaky.d lists it.
      - run: bash scripts/ci/flaky-check.sh lint
      - run: pnpm -r exec bash "$GITHUB_WORKSPACE/scripts/ci/pr-test.sh"
        env:
          SX_FLAKY_OUT: ${{ runner.temp }}/retried.txt
      - if: always()
        run: bash scripts/ci/flaky-check.sh retried "$SX_FLAKY_OUT"
        env:
          SX_FLAKY_OUT: ${{ runner.temp }}/retried.txt
      - run: pnpm test:scripts

  rust:
    needs: detect
    # Also in a duplicate run, whose detect is skipped (the concurrency comment above): a skipped matrix job reports as
    # plain "rust", and that newer suite then hid the required "rust (ubuntu-latest)" from a pull request. There it
    # starts and skips every step (DUP), so it reports "rust (ubuntu-latest)" passed in seconds instead of building.
    if: ${{ !cancelled() && (needs.detect.outputs.rust == 'true' || needs.detect.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # a pull request gets Linux only; main also gets macOS and Windows
        os: ${{ github.event_name != 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DUP: ${{ needs.detect.result == 'skipped' }}
    steps:
      - if: env.DUP != 'true'
        uses: actions/checkout@v4
      - if: env.DUP != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: env.DUP != 'true'
        uses: Swatinem/rust-cache@v2
      # A Cargo.lock that no longer matches the manifests fails here, before a build quietly rewrites it.
      - if: env.DUP != 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash
      - if: env.DUP != 'true'
        run: cargo fmt --all --check
      - if: env.DUP != 'true'
        run: cargo clippy --workspace --exclude slicerx-desktop --all-targets -- -D warnings
      # A pull request and the merge queue run the unit tests and the G-code goldens here, and the integration tests in
      # rust-tests below; main runs every test here.
      - if: env.DUP != 'true' && github.event_name != 'push'
        run: cargo test --workspace --exclude slicerx-desktop --lib --bins
      - if: env.DUP != 'true' && github.event_name != 'push'
        run: cargo test -p sx-core --test reference
      # sx-link's real-service test runs the sx-cloud binary; it fails here, not skips, when it is missing.
      - if: env.DUP != 'true' && github.event_name == 'push'
        run: cargo build -p sx-cloud
      - if: env.DUP != 'true' && github.event_name == 'push'
        run: cargo test --workspace --exclude slicerx-desktop

  # The integration tests (each crate's tests/) for the merge queue and for a pull request labeled full-ci, so one that
  # breaks never lands; main runs them in the rust job. One run takes about 18 minutes, so they are split in four that
  # run side by side: sx-core's two longest (firmware, requests), the rest of sx-core with the desktop shell's clippy
  # and tests, and every other crate (with the MCP server's tests on the real core).
  rust-tests-part:
    name: rust tests (${{ matrix.part }})
    needs: detect
    if: needs.detect.outputs.rust == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        part: [firmware, requests, core, crates]
    # In the merge queue the two longest parts run on the self-hosted Linux runners (sx-pc), whose build directory stays
    # warm between runs: there they take about 2 minutes, against 8 to 11 on a fresh hosted runner, and they leave the
    # hosted job limit to the e2e shards. Each part has a runner of its own (labels sx-pc-core and sx-pc-crates), so
    # each build directory only ever builds one part. A pull request always runs them hosted. Setting the repository
    # variable RUST_TESTS_ON_PC to false sends them back to hosted runners at once; RUST_CRATES_ON_PC set to false sends
    # only the crates part there, so its three groups build side by side while core keeps the PC's warm build.
    runs-on: ${{ (((github.event_name == 'merge_group' && vars.RUST_TESTS_ON_PC != 'false') || (github.event_name == 'workflow_dispatch' && inputs.rust_tests_on_pc)) && (matrix.part == 'core' || (matrix.part == 'crates' && (github.event_name == 'workflow_dispatch' || vars.RUST_CRATES_ON_PC != 'false')))) && fromJSON(format('["self-hosted","sx-pc-{0}"]', matrix.part)) || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: merge group still queued
        run: eval "$SX_GROUP_CHECK"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      # Hosted runners install the toolchain and restore a cache. The self-hosted runners have the pinned toolchain
      # installed and keep one build directory per runner, and each cargo step there holds the machine's heavy lock.
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.part }}
      # The runner service sets HOME but not PATH: the toolchain in that HOME goes on PATH here, and a missing one stops
      # the job at once with a clear message instead of failing every cargo step.
      - if: runner.environment != 'github-hosted'
        run: |
          [ -x "$HOME/.cargo/bin/cargo" ] || { echo "::error::no cargo in $HOME/.cargo/bin on $RUNNER_NAME: install the pinned toolchain for this runner HOME"; exit 1; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || { echo "::error::the pinned toolchain on $RUNNER_NAME does not run cargo (see rust-toolchain.toml)"; exit 1; }
          # the runner's warm build directory, linked in as ./target: tests that find their binaries under the workspace's
          # target (sx-link's real-service test runs target/debug/sx-cloud) see the same tree; checkout removes the link only
          mkdir -p "$HOME/target/$RUNNER_NAME"
          if [ -L "$GITHUB_WORKSPACE/target" ]; then rm "$GITHUB_WORKSPACE/target"; fi
          [ ! -e "$GITHUB_WORKSPACE/target" ] || { echo "::error::$GITHUB_WORKSPACE/target is a directory, not the runner's link"; exit 1; }
          ln -s "$HOME/target/$RUNNER_NAME" "$GITHUB_WORKSPACE/target"
          echo "SX_HEAVY_LOCK=/mnt/c/builds/heavy-lock/lock" >> "$GITHUB_ENV"
          echo "SX_HEAVY_WAIT=1200" >> "$GITHUB_ENV"
          echo "HEAVY=bash $GITHUB_WORKSPACE/scripts/ci/heavy.sh timeout 1500" >> "$GITHUB_ENV"
      - if: matrix.part == 'firmware' || matrix.part == 'requests'
        run: cargo test -p sx-core --test ${{ matrix.part }}
      # every other test file of sx-core, read from the directory so a new one is never left out
      - if: matrix.part == 'core'
        run: |
          args=""
          for t in packages/core/tests/*.rs; do
            n=$(basename "$t" .rs)
            case $n in firmware | requests) ;; *) args="$args --test $n" ;; esac
          done
          eval "$SX_GROUP_CHECK"
          ${HEAVY:-} cargo test -p sx-core $args
      # The desktop shell (slicerx-desktop), which the workspace runs leave out: it links WebKitGTK and embeds the
      # frontend. Its clippy and tests, bridge included, ride on the core part, the shortest one on its runner (the
      # self-hosted runner has the system libraries; a hosted runner installs them). A placeholder page is enough to
      # compile it. Warm, this adds about a minute and a half to core, which still ends before firmware and requests.
      - if: matrix.part == 'core' && runner.environment == 'github-hosted'
        name: Linux system libraries for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - if: matrix.part == 'core'
        name: Desktop shell clippy and tests
        run: |
          [ -f apps/desktop/dist/index.html ] || { mkdir -p apps/desktop/dist && echo '<!doctype html><title>ci</title>' > apps/desktop/dist/index.html; }
          eval "$SX_GROUP_CHECK"
          ${HEAVY:-} cargo clippy -p slicerx-desktop --features agent-bridge --all-targets -- -D warnings
          ${HEAVY:-} cargo test -p slicerx-desktop --features agent-bridge
      # sx-link's real-service test runs the sx-cloud binary; it fails here, not skips, when it is missing.
      - if: matrix.part == 'crates'
        run: |
          eval "$SX_GROUP_CHECK"
          ${HEAVY:-} cargo build -p sx-cloud
          ${HEAVY:-} cargo test --workspace --exclude slicerx-desktop --exclude sx-core --test '*'
      # The MCP server's tests that slice with the real core, on the sx that sx-cli's tests above built. They skip
      # where there is no sx (the web job); here SLICERX_TEST_REQUIRE_SX makes a missing one fail them.
      - if: matrix.part == 'crates'
        uses: pnpm/action-setup@v4
      - if: matrix.part == 'crates'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: matrix.part == 'crates'
        run: |
          pnpm install --frozen-lockfile
          eval "$SX_GROUP_CHECK"
          export SLICERX_TEST_SX_BIN="$GITHUB_WORKSPACE/target/debug/sx"
          cd packages/mcp && ${HEAVY:-} bash "$GITHUB_WORKSPACE/scripts/ci/pr-test.sh"
        env:
          SLICERX_TEST_REQUIRE_SX: '1'
          SX_FLAKY_OUT: ${{ runner.temp }}/retried.txt
      - if: always() && matrix.part == 'crates'
        run: bash scripts/ci/flaky-check.sh retried "$SX_FLAKY_OUT"
        env:
          SX_FLAKY_OUT: ${{ runner.temp }}/retried.txt

  # One result for the integration test parts: the name to require. Passes when they were not run (a pull request
  # without full-ci, or no Rust change).
  rust-tests:
    needs: [detect, rust-tests-part]
    # skipped in a duplicate run (the concurrency comment at the top), which counts as passed
    if: ${{ !cancelled() && !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DETECT: ${{ needs.detect.result }}
          PARTS: ${{ needs.rust-tests-part.result }}
          AGAIN: ${{ (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci') }}
        run: |
          echo "detect: $DETECT, parts: $PARTS, duplicate run: $AGAIN"
          [ "$DETECT" = skipped ] && [ "$AGAIN" = true ] && exit 0
          [ "$DETECT" = success ] || exit 1
          [ "$PARTS" = success ] || [ "$PARTS" = skipped ]

  # The desktop app's agent bridge (docs/agent-bridge.md) on every platform it ships to, macOS included: the shell
  # compiles with the agent-bridge feature (its screenshot code is per platform) and the bridge's own tests pass. The
  # release workflow proves release binaries do not carry it (apps/desktop/release/check-agent-bridge.mjs).
  desktop-bridge:
    needs: detect
    # not a required check; the queue runs only what main requires
    if: needs.detect.outputs.rust == 'true' && github.event_name != 'merge_group'
    # on main, a newer push's job replaces one still waiting (the concurrency comment at the top)
    concurrency:
      group: ${{ github.event_name == 'push' && format('ci-push-desktop-bridge-{0}', matrix.os) || format('ci-desktop-bridge-{0}-{1}', github.run_id, matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-bridge
      # The shell embeds the frontend when it compiles; a placeholder page is enough to compile and test it.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html><title>ci</title>' > apps/desktop/dist/index.html
      - run: cargo check -p slicerx-desktop --features agent-bridge --all-targets
      - run: cargo test -p slicerx-desktop --features agent-bridge --bin slicerx agent_bridge
      - name: The default build has no bridge
        run: node apps/desktop/release/check-agent-bridge.mjs --manifest apps/desktop/src-tauri/Cargo.toml

  # The engine's WASM module, its size reported against 1056 KB gzip without failing (build-wasm.sh), then the web
  # bundle's size gate (apps/web/scripts/bundle-size.mjs runs at the end of its build).
  wasm:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-geom
      - run: sh scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen" >> "$GITHUB_PATH"
      - run: sh packages/core/web/scripts/build-wasm.sh
      # The geometry module the app's worker loads, then both modules for the e2e shards or the smoke job.
      - if: needs.detect.outputs.e2e == 'true' || needs.detect.outputs.smoke == 'true'
        run: sh packages/geom/wasm/scripts/build.sh
      - if: needs.detect.outputs.e2e == 'true' || needs.detect.outputs.smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: |
            packages/core/web/pkg/
            packages/geom/wasm/pkg/
          retention-days: 3
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slicerx/web build

  # The printer bridge (sx-link) for bridge.spec.ts, built beside the WASM modules so the shards do not wait longer.
  # A debug build without debug info: quicker to build, and a smaller artifact.
  sx-link:
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: sx-link
      # with the drivers' test hooks (sx-connect's `test-hooks`): the MCP suite hands the hub's PrusaLink scan a
      # neighbour list. Only this test build has them; the engine release builds sx-link without.
      - run: cargo build -p sx-link --features test-hooks
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: sx-link
          path: target/debug/sx-link
          retention-days: 3
          if-no-files-found: error

  # The Node suites that drive a real sx-link (link-client, setup, mcp, pair), on the binary built above. They skip
  # without SX_LINK_BIN, so nothing else runs them. Each test starts sx-link with --loopback, so nothing listens on the
  # network. The e2e job below counts this one, so a failure here fails the required e2e check.
  sx-link-suites:
    needs: [detect, sx-link]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # an artifact does not keep the file mode
      - uses: actions/download-artifact@v4
        with:
          name: sx-link
          path: ${{ runner.temp }}/sx-link
      # the job's env cannot name runner.temp, so the binary's path goes to the later steps through GITHUB_ENV
      - run: |
          chmod +x "$RUNNER_TEMP/sx-link/sx-link"
          echo "SX_LINK_BIN=$RUNNER_TEMP/sx-link/sx-link" >> "$GITHUB_ENV"
      - run: pnpm --filter @slicerx/link-client test
      - run: pnpm --filter @slicerx/connect test
      - run: pnpm --filter @slicerx/mcp exec vitest run test/link.test.ts
      - run: pnpm --filter @slicerx/pair exec vitest run test/link.integration.test.ts

  # The browser suite (apps/web/e2e) against `vite preview` of the web build. playwright.config.ts builds it with
  # no backend, so the store and feed run on the bundled demo catalog (features.demoData). Specs that need a
  # real service skip themselves: vault-flow.spec.ts without the stack from e2e/stack/vault-stack.sh. bridge.spec.ts
  # runs on the sx-link built above; SX_LINK_REQUIRE makes a missing one fail it, not skip it. Most phone tests skip
  # (desktop width only), so the desktop project gets twelve shards and the phone project four (six and two on a pull
  # request, which runs the suite only with full-ci or a change to its harness); a new project in playwright.config.ts
  # needs its own line in both lists.
  # --fully-parallel spreads the tests of the big files over the shards. A GitHub runner has 4 cores and one worker
  # drawing WebGL in software takes about 2.3 of them, so each shard runs one worker, leaving room for the app's own
  # slicer workers. The e2e job after them is the one name to require.
  # Specs tagged @gpu (drawing and pointer timing: first frames, overlays, playback frame rate, flicker, fit-check
  # drags, paint clicks) starve on software WebGL. While the GPU lane is on (the default), the desktop shards here
  # leave them out and e2e-gpu runs them on the project's GPU runner, for the merge queue and main only; a pull
  # request runs them nowhere and the merge queue catches them. The repository variable E2E_GPU_LANE set to false
  # runs them here again. E2E_ON_PC set to true moves the merge queue and main to the project's WSL runners instead
  # (label sx-pc), each project whole under the machine's heavy lock, with the @gpu specs included and no GPU lane.
  e2e-shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    needs: [detect, wasm, sx-link]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' && vars.E2E_ON_PC == 'true') && fromJSON('["self-hosted","sx-pc"]') || 'ubuntu-latest' }}
    # on the PC: up to 20 minutes for the heavy lock (SX_HEAVY_WAIT) plus 15 for the run (timeout 900) plus setup; a
    # pull request's half-size matrix gives each shard twice the tests
    timeout-minutes: ${{ (github.event_name != 'pull_request' && vars.E2E_ON_PC == 'true') && 40 || needs.detect.outputs.shards == 'half' && 35 || 25 }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ (github.event_name != 'pull_request' && vars.E2E_ON_PC == 'true') && fromJSON('[{"project":"desktop","shard":"1/1"},{"project":"phone","shard":"1/1"}]') || needs.detect.outputs.shards == 'half' && fromJSON('[{"project":"desktop","shard":"1/6"},{"project":"desktop","shard":"2/6"},{"project":"desktop","shard":"3/6"},{"project":"desktop","shard":"4/6"},{"project":"desktop","shard":"5/6"},{"project":"desktop","shard":"6/6"},{"project":"phone","shard":"1/2"},{"project":"phone","shard":"2/2"}]') || fromJSON('[{"project":"desktop","shard":"1/12"},{"project":"desktop","shard":"2/12"},{"project":"desktop","shard":"3/12"},{"project":"desktop","shard":"4/12"},{"project":"desktop","shard":"5/12"},{"project":"desktop","shard":"6/12"},{"project":"desktop","shard":"7/12"},{"project":"desktop","shard":"8/12"},{"project":"desktop","shard":"9/12"},{"project":"desktop","shard":"10/12"},{"project":"desktop","shard":"11/12"},{"project":"desktop","shard":"12/12"},{"project":"phone","shard":"1/4"},{"project":"phone","shard":"2/4"},{"project":"phone","shard":"3/4"},{"project":"phone","shard":"4/4"}]') }}
    steps:
      - name: merge group still queued
        run: eval "$SX_GROUP_CHECK"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # the project runner keeps its pnpm store and browsers locally; uploading them gains nothing
          cache: ${{ runner.environment == 'self-hosted' && '' || 'pnpm' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-modules
          path: packages
      # an artifact does not keep the file mode
      - uses: actions/download-artifact@v4
        with:
          name: sx-link
          path: ${{ runner.temp }}/sx-link
      - run: chmod +x "$RUNNER_TEMP/sx-link/sx-link"
      - id: pw
        run: echo "version=$(pnpm --filter @slicerx/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # the project runner's system packages are installed once by its admin; two jobs running apt at once collide
      - run: |
          deps="--with-deps"
          [ "$RUNNER_ENVIRONMENT" = self-hosted ] && deps=""
          pnpm --filter @slicerx/web exec playwright install $deps chromium
      # One retry per failing test, as in the web job. The next step decides from the results: a test that passed only
      # on the retry, or failed both times, fails the job unless scripts/ci/flaky.d or quarantine.d lists it
      # (scripts/ci/README.md, "Flaky tests"). Playwright's own exit code is left to that step.
      # on the PC the run holds the machine's heavy lock, so it never shares the CPU with an agent's test run
      # and uses 5 workers: each one draws software WebGL on more than two threads, and 8 drove the load near 70 on 24
      - run: |
          eval "$SX_GROUP_CHECK"
          run=""
          [ "$RUNNER_ENVIRONMENT" = self-hosted ] && run="bash scripts/ci/heavy.sh --e2e timeout 900"
          # on GitHub's runners, the load during the run, so a starved shard shows in its log
          sampler=
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
            ( while :; do cut -d ' ' -f1 /proc/loadavg; sleep 10; done ) > "$RUNNER_TEMP/load.txt" & sampler=$!
          fi
          $run pnpm --filter @slicerx/web exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} ${{ (matrix.project == 'desktop' && vars.E2E_ON_PC != 'true' && vars.E2E_GPU_LANE != 'false') && '--grep-invert @gpu' || '' }} --fully-parallel --workers=${{ runner.environment == 'self-hosted' && 5 || 1 }} --retries=1 --reporter=blob,list,json --trace=retain-on-failure || bash scripts/ci/run-exit.sh $? "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          if [ -n "$sampler" ]; then
            kill "$sampler"
            sort -n "$RUNNER_TEMP/load.txt" | awk -v c="$(nproc)" '{a[NR]=$1} END {if (NR) print "runner load (1 min average, every 10 s, " c " cores): max " a[NR] ", median " a[int((NR+1)/2)] ", " NR " samples"}'
          fi
        env:
          SX_HEAVY_LOCK: /mnt/c/builds/heavy-lock/lock
          # a lock that is not free within 20 minutes fails the step with "gave up after 1200 s", not a cancel
          SX_HEAVY_WAIT: 1200
          # GitHub's runners draw WebGL in software, slower than the project runner: drawing time budgets in the specs
          # (e2e/frames.ts GL_SLOW) are three times the project runner's
          SX_SLOW_GL: ${{ runner.environment == 'self-hosted' && '1' || '3' }}
          SX_LINK_BIN: ${{ runner.temp }}/sx-link/sx-link
          SX_LINK_REQUIRE: '1'
          # one blob name per job, so the merged report keeps every shard of both projects
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ strategy.job-index }}.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results.json
      - name: flaky and quarantined tests
        run: |
          node scripts/ci/playwright-results.mjs "$RUNNER_TEMP/e2e-results.json" "$RUNNER_TEMP/retried.txt" "$RUNNER_TEMP/failed.txt"
          bad=0
          bash scripts/ci/flaky-check.sh retried "$RUNNER_TEMP/retried.txt" || bad=1
          while IFS= read -r t; do
            if [ "$(bash scripts/ci/flaky-check.sh status "$t")" = quarantined ]; then echo "flaky-check: failed, quarantined and counted: $t"
            else echo "::error title=Failed test::$t"; bad=1; fi
          done < "$RUNNER_TEMP/failed.txt"
          exit $bad
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.project }}-${{ strategy.job-index }}
          path: apps/web/blob-report/
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.project }}-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 14

  # A pull request that touches the app but does not run the browser suite runs these few quick specs in one job: the
  # app starts, loads the plate, slices, and draws each workspace (detect, "smoke"). Software WebGL, no sx-link.
  e2e-smoke:
    name: e2e smoke
    needs: [detect, wasm]
    if: needs.detect.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-modules
          path: packages
      - id: pw
        run: echo "version=$(pnpm --filter @slicerx/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @slicerx/web exec playwright install --with-deps chromium
      # One retry per failing test, decided by the results as in e2e-shard.
      - run: pnpm --filter @slicerx/web exec playwright test --project=desktop e2e/minimal.spec.ts e2e/blocked-slice.spec.ts e2e/slice-track.spec.ts e2e/icons.spec.ts --grep-invert @gpu --workers=1 --retries=1 --reporter=list,json --trace=retain-on-failure || echo "playwright exited $?"
        env:
          SX_SLOW_GL: '3'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results.json
      - name: flaky and quarantined tests
        run: |
          node scripts/ci/playwright-results.mjs "$RUNNER_TEMP/e2e-results.json" "$RUNNER_TEMP/retried.txt" "$RUNNER_TEMP/failed.txt"
          bad=0
          bash scripts/ci/flaky-check.sh retried "$RUNNER_TEMP/retried.txt" || bad=1
          while IFS= read -r t; do
            if [ "$(bash scripts/ci/flaky-check.sh status "$t")" = quarantined ]; then echo "flaky-check: failed, quarantined and counted: $t"
            else echo "::error title=Failed test::$t"; bad=1; fi
          done < "$RUNNER_TEMP/failed.txt"
          exit $bad
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-smoke
          path: apps/web/test-results/
          retention-days: 14

  # The @gpu specs for the merge queue and main on the project's GPU runners (label sx-gpu, Windows): the installed
  # Chrome draws WebGL on the GPU, so they run fast and steady. Six workers: each page also starts the app's own slicer
  # workers, and the machine's CPU is the limit, not the GPU. Several runners share the machine: the @gpu specs run
  # under a shared GPU hold of the heavy lock (heavy.sh --gpu, as many at once as <lock>.gpu-slots allows), and the
  # frame timing specs (@gpu-timing) after them under the exclusive e2e hold, with no other browser suite running.
  # Each runner serves on its own port, SX_E2E_PORT from the runner's .env (sx-gpu-1 has 4419, the others 4420 and
  # on). Steps run in Git Bash, named by path (the runners' accounts have no bash on their PATH and Windows' default
  # PowerShell script policy). Never for pull requests. If the runners are offline, set E2E_GPU_LANE to false.
  e2e-gpu:
    name: e2e (desktop @gpu)
    needs: [detect, wasm]
    if: needs.detect.outputs.e2e == 'true' && github.event_name != 'pull_request' && vars.E2E_ON_PC != 'true' && vars.E2E_GPU_LANE != 'false'
    runs-on: [self-hosted, sx-gpu]
    # up to 20 minutes for each hold of the heavy lock (SX_HEAVY_WAIT), 15 for the run (timeout 900), 5 for the
    # timing run (timeout 300), plus setup
    timeout-minutes: 65
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: merge group still queued
        run: eval "$SX_GROUP_CHECK"
        env:
          GH_TOKEN: ${{ github.token }}
      # The runner keeps its workspace between jobs. Checkout's own clean deletes every node_modules (and fails on
      # Windows' path limit inside them), so pnpm relinks the whole tree each run. Instead: long paths on, checkout
      # without its clean, then clean everything but node_modules; pnpm install brings those up to the lockfile.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          clean: false
      - run: git clean -ffdxq -e node_modules
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-modules
          path: packages
      # One retry per failing test; the next step decides from the results, as in e2e-shard. The runner's port comes
      # from its .env (4317 is the default on a developer's machine, 4417 and 4418 are the WSL runners'), 4419 when it
      # sets none.
      - run: eval "$SX_GROUP_CHECK"; SX_E2E_PORT=${SX_E2E_PORT:-4419} bash scripts/ci/heavy.sh --gpu timeout 900 pnpm --filter @slicerx/web exec playwright test --project=desktop --grep @gpu --grep-invert @gpu-timing --fully-parallel --workers=6 --retries=1 --reporter=blob,list,json --trace=retain-on-failure || bash scripts/ci/run-exit.sh $? "$PLAYWRIGHT_JSON_OUTPUT_FILE"
        env:
          SX_HEAVY_LOCK: C:/builds/heavy-lock/lock
          SX_HEAVY_WAIT: 1200
          SX_E2E_GPU: '1'
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-desktop-gpu.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results.json
      # The frame timing specs, alone on the machine: they measure frame gaps, which another suite's load would skew.
      # Their blob joins the first run's (PWTEST_BLOB_DO_NOT_REMOVE) and their failures go to their own folder.
      - run: eval "$SX_GROUP_CHECK"; SX_E2E_PORT=${SX_E2E_PORT:-4419} bash scripts/ci/heavy.sh --e2e timeout 300 pnpm --filter @slicerx/web exec playwright test --project=desktop --grep @gpu-timing --workers=6 --retries=1 --reporter=blob,list,json --trace=retain-on-failure --output=test-results/timing || bash scripts/ci/run-exit.sh $? "$PLAYWRIGHT_JSON_OUTPUT_FILE"
        env:
          SX_HEAVY_LOCK: C:/builds/heavy-lock/lock
          SX_HEAVY_WAIT: 1200
          SX_E2E_GPU: '1'
          PWTEST_BLOB_DO_NOT_REMOVE: '1'
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-desktop-gpu-timing.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results-timing.json
      - name: flaky and quarantined tests
        run: |
          node scripts/ci/playwright-results.mjs "$RUNNER_TEMP/e2e-results.json" "$RUNNER_TEMP/retried.txt" "$RUNNER_TEMP/failed.txt"
          node scripts/ci/playwright-results.mjs "$RUNNER_TEMP/e2e-results-timing.json" "$RUNNER_TEMP/retried-timing.txt" "$RUNNER_TEMP/failed-timing.txt"
          cat "$RUNNER_TEMP/retried-timing.txt" >> "$RUNNER_TEMP/retried.txt"
          cat "$RUNNER_TEMP/failed-timing.txt" >> "$RUNNER_TEMP/failed.txt"
          bad=0
          bash scripts/ci/flaky-check.sh retried "$RUNNER_TEMP/retried.txt" || bad=1
          while IFS= read -r t; do
            if [ "$(bash scripts/ci/flaky-check.sh status "$t")" = quarantined ]; then echo "flaky-check: failed, quarantined and counted: $t"
            else echo "::error title=Failed test::$t"; bad=1; fi
          done < "$RUNNER_TEMP/failed.txt"
          exit $bad
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-desktop-gpu
          path: apps/web/blob-report/
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-desktop-gpu
          path: apps/web/test-results/
          retention-days: 14

  # One result for the shards and the @gpu run, and their reports merged into one HTML report, with the traces of
  # failures.
  e2e:
    needs: [detect, e2e-shard, e2e-smoke, e2e-gpu, sx-link-suites]
    # skipped in a duplicate run (the concurrency comment at the top), which counts as passed
    if: ${{ !cancelled() && !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        uses: actions/checkout@v4
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        uses: pnpm/action-setup@v4
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        run: pnpm install --frozen-lockfile
      # the reports are for reading only, so a download that fails (it has, after its retries) loses the HTML report,
      # never the result
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: apps/web/blob-reports
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        # the report is for reading only: a merge that fails (a Windows report beside Linux ones) loses the HTML
        # report, never the result, which the last step decides
        continue-on-error: true
        run: pnpm --filter @slicerx/web exec playwright merge-reports -c playwright.merge.config.ts --reporter html ./blob-reports
      - if: needs.e2e-shard.result != 'skipped' || needs.e2e-gpu.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: apps/web/playwright-report/
          retention-days: 14
      # Passes when the suite was not needed; fails when it was and a shard, the @gpu run, the sx-link suites, or the
      # build before them did not pass, or when the smoke job was needed and did not pass. The @gpu run is skipped
      # when this event does not use it (pull requests, or the lane switched off).
      - env:
          DETECT: ${{ needs.detect.result }}
          WANTED: ${{ needs.detect.outputs.e2e }}
          SHARDS: ${{ needs.e2e-shard.result }}
          SMOKE_WANTED: ${{ needs.detect.outputs.smoke }}
          SMOKE: ${{ needs.e2e-smoke.result }}
          BRIDGE: ${{ needs.sx-link-suites.result }}
          GPU: ${{ needs.e2e-gpu.result }}
          GPU_LANE: ${{ github.event_name != 'pull_request' && vars.E2E_ON_PC != 'true' && vars.E2E_GPU_LANE != 'false' }}
          AGAIN: ${{ (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci') }}
        run: |
          echo "detect: $DETECT, e2e wanted: $WANTED, shards: $SHARDS, smoke wanted: $SMOKE_WANTED, smoke: $SMOKE, sx-link suites: $BRIDGE, GPU lane: $GPU_LANE, @gpu run: $GPU, duplicate run: $AGAIN"
          [ "$DETECT" = skipped ] && [ "$AGAIN" = true ] && exit 0
          [ "$DETECT" = success ] || exit 1
          if [ "$SMOKE_WANTED" = true ]; then [ "$SMOKE" = success ] || exit 1; fi
          [ "$WANTED" != true ] && exit 0
          [ "$SHARDS" = success ] || exit 1
          [ "$BRIDGE" = success ] || exit 1
          if [ "$GPU_LANE" = true ]; then [ "$GPU" = success ]; fi

  # The database tests (pgTAP) on a throwaway local Supabase with only the services they use: the database, auth
  # and storage. Then the module drop check, and the whole suite again on a second stack without the default
  # grants, the way a hosted project starts (supabase/README.md).
  pgtap:
    needs: detect
    if: needs.detect.outputs.pgtap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,mailpit,postgres-meta,postgrest
      - run: supabase test db
      - run: sh supabase/modules/check-drop.sh
      - run: supabase stop --no-backup
      - run: sh supabase/tests/no-default-grants.sh "$RUNNER_TEMP/nogrants"
        env:
          SX_SUPABASE_CLI: supabase

  # Heavy: builds the engine in release mode and installs a browser. Pushes to main only.
  devkit:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.node == 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p sx-cli --release
      - run: pnpm --filter @slicerx/web exec playwright install --with-deps chromium
      # The integrator sample, installed from packed tarballs the way an outside app gets the packages.
      - run: node examples/integrator-sample/scripts/integration.mjs
        env:
          SLICERX_SX_BIN: ${{ github.workspace }}/target/release/sx

  # The heavy-work lock of the self-hosted CI (scripts/ci/heavy.sh), on a temporary lock.
  heavy-lock:
    # nothing to do in a duplicate run (the concurrency comment at the top); a skipped job counts as passed
    if: ${{ github.event_name != 'merge_group' && !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    # on main, a newer push's job replaces one still waiting (the concurrency comment at the top)
    concurrency:
      group: ${{ github.event_name == 'push' && 'ci-push-heavy-lock' || format('ci-heavy-lock-{0}', github.run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/heavy-test.sh

  secrets:
    # nothing to do in a duplicate run (the concurrency comment at the top); a skipped job counts as passed
    if: ${{ !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the gitleaks CLI is free for organizations; the action needs a paid license
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          # Only the commits this run is about: a pull request's own commits (base..head), or main's history on a
          # push. Without a range gitleaks scans every fetched branch, so one bad branch would fail every pull request.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$BASE_SHA..$HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then range="$MQ_BASE_SHA..$MQ_HEAD_SHA"
          else range="$GITHUB_SHA"; fi
          ./gitleaks detect --source . --log-opts="$range" --redact --verbose --exit-code 1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}

  licenses:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every file has its copyright and license, from its own header or REUSE.toml (docs/licensing.md). pipx comes
      # with the runner; the pinned release keeps the result from changing under us.
      - name: reuse lint
        run: pipx run reuse==5.0.2 lint
      # cargo-deny as its pinned release, checked against the sum below on every run. The action ran in a container
      # pulled from Docker Hub without logging in, and its rate limit for that failed this check.
      - if: needs.detect.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.detect.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo-deny-dl
          key: cargo-deny-0.20.2 # gitleaks:allow (a cache key, not a secret)
      - name: cargo-deny
        if: needs.detect.outputs.rust == 'true'
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          tgz="$HOME/.cargo-deny-dl/$name.tar.gz"
          mkdir -p "$HOME/.cargo-deny-dl"
          [ -f "$tgz" ] || curl -fsSL --retry 5 -o "$tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/cargo-deny" --version
          "$RUNNER_TEMP/$name/cargo-deny" check licenses bans sources advisories
      - name: pnpm license check
        if: needs.detect.outputs.node == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm dlx license-checker-rseidelsohn --production --summary \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;MPL-2.0;Unlicense;BlueOak-1.0.0;Python-2.0;CC-BY-4.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-3.0-only;GPL-3.0-or-later;LGPL-3.0-only;LGPL-3.0-or-later"

  dco:
    # nothing to do in a duplicate run (the concurrency comment at the top); a skipped job counts as passed
    if: ${{ github.event_name == 'pull_request' && !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          exit $bad

  hygiene:
    # nothing to do in a duplicate run (the concurrency comment at the top); a skipped job counts as passed
    if: ${{ !((github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em or en dashes in docs
        run: |
          set -u
          fail=0
          files=$(git ls-files '*.md' '*.html' '*.tsx' '*.ts' '*.css' ':!LICENSE' ':!CODE_OF_CONDUCT.md' ':!packages/vendor/**' 2>/dev/null || true)
          if [ -n "$files" ] && echo "$files" | xargs grep -nP '\x{2014}|\x{2013}' ; then
            echo "Em or en dash found."; fail=1
          fi
          exit $fail

version = 1
SPDX-PackageName = "SlicerX"
SPDX-PackageDownloadLocation = "https://github.com/slicerx-oss/slicerx"

# Source files carry their own SPDX headers. Files that cannot carry one (data, docs, images, test
# fixtures) are SlicerX's own under Apache-2.0 unless an entry below says otherwise; the later entries
# take precedence. The SlicerX name and logo stay trademarks; see TRADEMARK.md. See docs/licensing.md.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The SlicerX contributors"
SPDX-License-Identifier = "Apache-2.0"

# The makers' stock printer, filament and process profiles, from the profile resources of
# OrcaSlicer and Bambu Studio.
[[annotations]]
path = ["packages/profiles/gcode.json", "packages/profiles/machine.json", "packages/profiles/process-speeds.json", "packages/profiles/filaments/**", "packages/profiles/resolved/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["The OrcaSlicer and Bambu Studio contributors and the printer makers", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "AGPL-3.0-or-later"


# Bambu Lab's printer certificate authorities (BBL CA, BBL CA2 RSA and BBL CA2 ECC), the trust anchors
# for Bambu Lab printers' LAN certificates, copied unchanged from Bambu Studio's resources/cert/printer.cer.
[[annotations]]
path = ["packages/connect/certs/bambu-ca.pem"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Bambu Lab"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Printer pictures for the setup's model grid: the makers' cover images from the profile resources of
# OrcaSlicer (BBL covers come from Bambu Studio), re-encoded as webp.
[[annotations]]
path = ["packages/profiles/printer-images/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["The OrcaSlicer and Bambu Studio contributors and the printer makers"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The UltiMaker S series machine, print core, quality and G-code settings, resolved from UltiMaker Cura's
# definitions, variants, materials and quality profiles (packages/settings/scripts/gen-ultimaker.py).
[[annotations]]
path = ["packages/profiles/cura/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["UltiMaker B.V. and the UltiMaker Cura contributors", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "LGPL-3.0-or-later"

# The settings OrcaSlicer 2.4.2 resolves for the parity reference, as it wrote them.
[[annotations]]
path = "packages/core/bench/compare/orca_base.json"
precedence = "aggregate"
SPDX-FileCopyrightText = ["The OrcaSlicer contributors", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The credit kit for products built on SlicerX: badges, the support button, their copy and screenshots.
# The SlicerX name and logo in them stay trademarks; see TRADEMARK.md.
[[annotations]]
path = ["docs/integrators/credit-kit/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The SlicerX contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored Rust crates, with the changes listed in each SOURCE.md under the crate's own license.
[[annotations]]
path = ["packages/vendor/i_overlay/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["Nail Sharipov", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["packages/vendor/cpp_map/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["eadf", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["packages/vendor/boostvoronoi/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["eadf", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "BSL-1.0"

# occt-import-js built with Open CASCADE Technology, for reading STEP files (SOURCE.md). The build
# scripts are ours.
[[annotations]]
path = ["packages/vendor/occt-import-js/lib/**", "packages/vendor/occt-import-js/patches/**", "packages/vendor/occt-import-js/OCCT_LGPL_EXCEPTION.txt"]
precedence = "closest"
SPDX-FileCopyrightText = ["Viktor Kovacs", "Open CASCADE SAS"]
SPDX-License-Identifier = "LGPL-2.1-only AND LGPL-2.1-only WITH OCCT-exception-1.0"

# The outline font for text solids, a subset of Hanken Grotesk SemiBold (packages/geom/fonts/README.md).
[[annotations]]
path = ["packages/geom/fonts/*.ttf", "packages/geom/fonts/OFL.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "The Hanken Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Printer maker logos from the makers' own press kits, unaltered, used only to name their printers and
# with their permission (packages/brand-icons/LOGOS.md). They are not under an open license.
[[annotations]]
path = ["packages/brand-icons/assets/prusa-*.png", "packages/brand-icons/assets/flashforge-*.png"]
precedence = "closest"
SPDX-FileCopyrightText = ["Prusa Research a.s.", "Flashforge"]
SPDX-License-Identifier = "LicenseRef-Trademark-Permission"

# Preset files and a project saved by OrcaSlicer, Bambu Studio and PrusaSlicer for the import tests and
# the parity reference. The settings in them come from those apps' AGPL profiles; the meshes are ours.
[[annotations]]
path = ["packages/settings/fixtures/preset-files/**", "packages/core/bench/models/x-mark-2color-orca.3mf"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["The OrcaSlicer, Bambu Studio and PrusaSlicer contributors", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# G-code CuraEngine wrote for the UltiMaker import test, from Cura's LGPL machine definitions.
[[annotations]]
path = "packages/settings/tests/fixtures/cura-ultimaker.json"
precedence = "aggregate"
SPDX-FileCopyrightText = ["UltiMaker B.V. and the UltiMaker Cura contributors", "2026 The SlicerX contributors"]
SPDX-License-Identifier = "LGPL-3.0-or-later"

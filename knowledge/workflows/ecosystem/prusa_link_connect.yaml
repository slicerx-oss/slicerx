kind: guide
schema_version: 1
id: prusa_link_connect
name: PrusaLink and Prusa Connect
applies_to: [prusa_mk4s, prusa_core_one, prusa_xl]
summary: >
  PrusaLink is the local web API built into Prusa printers with a documented
  OpenAPI spec. Prusa Connect is Prusa's cloud service for remote control and a
  print queue. SlicerX can drive PrusaLink directly for upload, start, pause,
  stop, status and camera snapshots. Prusa Connect has no public automation API,
  so treat it as a manual or PrusaSlicer path.
facts:
  - {text: "PrusaLink's API is documented as OpenAPI (spec/openapi.yaml in Prusa-Link-Web). Endpoints live under /api/v1 and use HTTP digest authentication. Older API key style X-Api-Key still exists and is off by default.", src: [prusalink_openapi]}
  - {text: "Status and control endpoints: GET /api/v1/status, GET /api/v1/info, GET /api/v1/job, PUT /api/v1/job/{id}/pause, PUT /api/v1/job/{id}/resume, DELETE /api/v1/job/{id} to stop.", src: [prusalink_openapi]}
  - {text: "Upload is PUT /api/v1/files/{storage}/{path} with headers Content-Length, Content-Type (default application/octet-stream), Print-After-Upload (?0 or ?1) and Overwrite (?0 or ?1). POST to the same path starts printing a stored file.", src: [prusalink_openapi]}
  - {text: "Storage listing is GET /api/v1/storage, transfer state is GET /api/v1/transfer, and camera snapshots are GET /api/v1/cameras/snap or /api/v1/cameras/{id}/snap.", src: [prusalink_openapi]}
  - {text: "PrusaSlicer sends G-code to PrusaLink from the G> button, with upload and print options. For Prusa Connect it has its own tab, which Prusa recommends over the older physical printer entry.", src: [prusa_kb_sending_gcode]}
  - {text: "Prusa Connect can accept uploads with three choices: start now, add to the print queue, or store in cloud storage. It also handles remote monitoring.", src: [prusa_blog_connect]}
  - {text: "I found no official public Prusa Connect automation API. A Prusa forum thread asks for one. Treat cloud automation as unsupported.", src: [prusa_kb_sending_gcode]}
steps:
  - {text: "Enable PrusaLink on the printer and note the address and the digest credentials from the printer's network settings."}
  - {text: "In SlicerX, add the printer as a PrusaLink host by IP or hostname and test with GET /api/version."}
  - {text: "Slice, then upload with PUT and Print-After-Upload set to ?0 unless the user confirms the plate is clear."}
  - {text: "Poll /api/v1/status for progress. Use pause and resume by job id."}
pilot_actions:
  - "Upload sliced G-code to a chosen storage and folder, and optionally start it after the user confirms the bed is clear."
  - "Read printer state, job progress, temperatures and current job before advising mid print changes."
  - "Pause or stop a job when the user asks or a failure is detected, with confirmation first."
  - "Fetch a camera snapshot when the user asks mimir to look at a failing print."
  - "Never send Print-After-Upload=?1 without explicit user confirmation."
  - "Do not attempt to edit printer settings over PrusaLink; the documented API covers files, jobs, storage, cameras and updates only."
settings:
  - {advice: "Use digest authentication and a strong password on PrusaLink; do not expose the port to the internet.", kind: workflow}
src: [prusalink_openapi, prusa_kb_sending_gcode, prusa_blog_connect]

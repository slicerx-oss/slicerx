kind: guide
schema_version: 1
id: printed_threads
name: Printing threads that screw together
aliases: [threads, screw threads, printed bolt, printed nut, threaded parts, thread fit, trapezoidal thread, acme thread, heat set insert]
applies_to: [all]
summary: >
  How to print threads that screw together: stand the thread axis upright,
  print fine layers, prefer a trapezoidal or ACME profile to a sharp V thread,
  and leave clearance on the male thread. For strong threads or parts taken
  apart often, melt in a metal heat-set insert instead.
facts:
  - {text: "Stand threaded parts upright on the plate. Printed flat, the thread profile squashes into an oval.", src: [snapmaker_blog_threads]}
  - {text: "Use a 0.16 mm layer height, or 0.12 mm for cleaner threads. Finer layers follow the thread's curve more closely.", src: [snapmaker_blog_threads]}
  - {text: "Prefer an ACME or trapezoidal thread to a standard V thread. The V thread's sharp 60 degree flanks print as hard overhangs.", src: [snapmaker_blog_threads]}
  - {text: "A 3 mm peg will not fit a 3 mm hole, because extruded lines come out wider than the nozzle. Give the male thread a small negative offset, and test with a small nut and bolt (M10 or M12) before a big part.", src: [snapmaker_blog_threads]}
  - {text: "For strong threads or parts assembled again and again, use a metal heat-set insert pressed in with a soldering iron.", src: [snapmaker_blog_threads]}
  - {text: "Prusa sets the soldering iron to the print temperature of the part's filament plus 10 to 20 C, and the printed plastic melts and reflows around the insert's knurled outside.", src: [prusa_store_heat_set_inserts]}
pilot_actions:
  - "Suggest upright orientation first, then layer height, then the thread profile."
  - "For clearance, point to the tolerance calibration (workflow tolerance) rather than one number for every printer."
  - "Suggest a heat-set insert when the thread carries load or is screwed in and out often."
src: [snapmaker_blog_threads, prusa_store_heat_set_inserts]

# Canonical slicer settings that mimir may read or change.
# Keys are OrcaSlicer config keys, checked against src/libslic3r/PrintConfig.cpp,
# except entries marked origin: slicerx, which are SlicerX settings
# at commit 7d42ad17a45c1c44d07f382f14244223565e9cb8 (source prefix orca_src).
# Every key referenced anywhere under knowledge/ must be listed here.
#
# scope:   process (print profile or per object), filament, machine, plate or project
#          (plate and project keys live in the 3MF project, not in a preset)
# type:    percent_or_mm accepts "0.42" or "110%" (Orca coFloatOrPercent). Many speed,
#          temperature and fan keys are per extruder lists in Orca (a profile stores
#          ["220"]); the types here describe one element.
# pilot:   edit    mimir may change it in a plate or object override without asking
#          guarded mimir always shows the change in the settings diff; a value outside
#                  the filament's range needs explicit approval, and a value outside the
#                  printer's hardware limit is refused
#          read    mimir reads it only
# bounds:  hard guardrails for any value mimir writes. Values outside are rejected.
kind: settings_catalog
schema_version: 1
src: ["orca_src:src/libslic3r/PrintConfig.cpp"]
settings:
  # Quality and geometry
  - {key: layer_height, label: Layer height, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.04, max: 0.8}, note: "Keep between 25 and 75 percent of nozzle diameter"}
  - {key: initial_layer_print_height, label: First layer height, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.08, max: 0.8}}
  - {key: line_width, label: Default line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: outer_wall_line_width, label: Outer wall line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: inner_wall_line_width, label: Inner wall line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: sparse_infill_line_width, label: Sparse infill line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: internal_solid_infill_line_width, label: Solid infill line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: top_surface_line_width, label: Top surface line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: initial_layer_line_width, label: First layer line width, group: quality, scope: process, type: percent_or_mm, unit: mm, pilot: edit, bounds: {min: 0.1, max: 2.0}}
  - {key: seam_position, label: Seam position, group: quality, scope: process, type: enum, values: [nearest, aligned, aligned_back, back, random], pilot: edit}
  - {key: seam_gap, label: Seam gap, group: quality, scope: process, type: percent_or_mm, pilot: edit}
  - {key: seam_slope_type, label: Scarf joint seam, group: quality, scope: process, type: enum, values: [none, external, all], pilot: edit}
  - {key: staggered_inner_seams, label: Staggered inner seams, group: quality, scope: process, type: bool, pilot: edit}
  - {key: wall_generator, label: Wall generator, group: quality, scope: process, type: enum, values: [classic, arachne], pilot: edit}
  - {key: precise_outer_wall, label: Precise wall, group: quality, scope: process, type: bool, pilot: edit}
  - {key: wall_sequence, label: Wall printing order, group: quality, scope: process, type: enum, values: ["inner wall/outer wall", "outer wall/inner wall", "inner-outer-inner wall"], pilot: edit}
  - {key: xy_hole_compensation, label: X-Y hole compensation, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: -0.5, max: 0.5}}
  - {key: xy_contour_compensation, label: X-Y contour compensation, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: -0.5, max: 0.5}}
  - {key: elefant_foot_compensation, label: Elephant foot compensation, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0, max: 1.0}, note: "Orca spells the key elefant"}
  - {key: hole_to_polyhole, label: Convert holes to polyholes, group: quality, scope: process, type: bool, pilot: edit}
  - {key: precise_z_height, label: Precise Z height, group: quality, scope: process, type: bool, pilot: edit}
  - {key: resolution, label: Slice resolution, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.001, max: 0.1}}
  - {key: enable_arc_fitting, label: Arc fitting, group: quality, scope: process, type: bool, pilot: edit}
  - {key: ironing_type, label: Ironing type, group: quality, scope: process, type: enum, values: [no ironing, top, topmost, solid], pilot: edit}
  - {key: ironing_flow, label: Ironing flow, group: quality, scope: process, type: percent, pilot: edit, bounds: {min: 0, max: 30}}
  - {key: ironing_spacing, label: Ironing line spacing, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.05, max: 0.5}}
  - {key: ironing_speed, label: Ironing speed, group: quality, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 200}}
  - {key: fuzzy_skin, label: Fuzzy skin, group: quality, scope: process, type: enum, values: [none, external, hole, all, allwalls], pilot: edit}
  - {key: spiral_mode, label: Spiral vase, group: special, scope: process, type: bool, pilot: edit}
  - {key: spiral_mode_smooth, label: Smooth spiral, group: special, scope: process, type: bool, pilot: edit}
  # SlicerX keys (not in Orca): sleipnir, automatic variable layer height
  - {key: smart_layer, label: sleipnir, group: quality, scope: process, type: enum, values: ["off", quality, strength], pilot: edit, origin: slicerx}
  - {key: smart_layer_min_height, label: sleipnir thinnest layer, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.04, max: 0.8}, origin: slicerx, note: "Clamped to the filament's smart_layer.min_ratio times the nozzle diameter"}
  - {key: smart_layer_max_height, label: sleipnir thickest layer, group: quality, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0.04, max: 0.8}, origin: slicerx, note: "Clamped to the filament's smart_layer.max_ratio times the nozzle diameter"}
  - {key: print_sequence, label: Print sequence, group: special, scope: process, type: enum, values: [by layer, by object], pilot: edit}
  - {key: detect_thin_wall, label: Detect thin walls, group: quality, scope: process, type: bool, pilot: edit}
  - {key: filament_shrink, label: Shrinkage compensation XY, group: quality, scope: filament, type: percent, pilot: guarded, bounds: {min: 95, max: 105}}

  # Strength: walls, shells, infill
  - {key: wall_loops, label: Wall loops, group: strength, scope: process, type: int, pilot: edit, bounds: {min: 1, max: 20}}
  - {key: alternate_extra_wall, label: Alternate extra wall, group: strength, scope: process, type: bool, pilot: edit}
  - {key: top_shell_layers, label: Top shell layers, group: strength, scope: process, type: int, pilot: edit, bounds: {min: 0, max: 50}}
  - {key: bottom_shell_layers, label: Bottom shell layers, group: strength, scope: process, type: int, pilot: edit, bounds: {min: 0, max: 50}}
  - {key: top_shell_thickness, label: Top shell thickness, group: strength, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0, max: 10}}
  - {key: bottom_shell_thickness, label: Bottom shell thickness, group: strength, scope: process, type: float, unit: mm, pilot: edit, bounds: {min: 0, max: 10}}
  - {key: sparse_infill_density, label: Infill density, group: strength, scope: process, type: percent, pilot: edit, bounds: {min: 0, max: 100}}
  - {key: sparse_infill_pattern, label: Infill pattern, group: strength, scope: process, type: enum, values: [rectilinear, alignedrectilinear, zigzag, crosszag, lockedzag, line, grid, triangles, tri-hexagon, cubic, adaptivecubic, quartercubic, supportcubic, lightning, honeycomb, 3dhoneycomb, lateral-honeycomb, lateral-lattice, crosshatch, tpmsd, tpmsfk, gyroid, concentric, hilbertcurve, archimedeanchords, octagramspiral], pilot: edit}
  - {key: top_surface_pattern, label: Top surface pattern, group: quality, scope: process, type: enum, values: [monotonic, monotonicline, rectilinear, alignedrectilinear, concentric, spiralinset, hilbertcurve, archimedeanchords, octagramspiral], pilot: edit}

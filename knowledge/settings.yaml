  - {key: reduce_infill_retraction, label: Reduce infill retraction, group: retraction, scope: process, type: bool, pilot: edit}
  - {key: reduce_crossing_wall, label: Avoid crossing walls, group: retraction, scope: process, type: bool, pilot: edit}

  # Overhangs and bridges

  - {key: infill_combination, label: Combine infill layers, group: strength, scope: process, type: bool, pilot: edit}
  - {key: ensure_vertical_shell_thickness, label: Ensure vertical shell thickness, group: strength, scope: process, type: enum, values: [none, ensure_critical_only, ensure_moderate, ensure_all], pilot: edit}
  - {key: only_one_wall_top, label: Only one wall on top surfaces, group: quality, scope: process, type: bool, pilot: edit}
  - {key: interface_shells, label: Interface shells, group: strength, scope: process, type: bool, pilot: edit}
  - {key: extra_perimeters_on_overhangs, label: Extra perimeters on overhangs, group: quality, scope: process, type: bool, pilot: edit}


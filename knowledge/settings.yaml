  - {key: initial_layer_speed, label: First layer speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 300}}
  - {key: initial_layer_infill_speed, label: First layer infill speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 300}}
  - {key: support_speed, label: Support speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 1000}}

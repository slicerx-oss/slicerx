  - {key: sparse_infill_speed, label: Sparse infill speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 1000}}
  - {key: internal_solid_infill_speed, label: Solid infill speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 1000}}

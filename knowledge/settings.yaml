  - {key: make_overhang_printable, label: Make overhangs printable, group: overhangs, scope: process, type: bool, pilot: edit, note: "Changes geometry. Tell the user."}
  - {key: counterbore_hole_bridging, label: Bridge counterbore holes, group: overhangs, scope: process, type: enum, pilot: edit}

  # Support
  - {key: enable_support, label: Enable support, group: support, scope: process, type: bool, pilot: edit}

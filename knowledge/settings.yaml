  - {key: outer_wall_acceleration, label: Outer wall acceleration, group: motion, scope: process, type: float, unit: mm/s2, pilot: edit, bounds: {min: 0, max: 50000}}
  - {key: inner_wall_acceleration, label: Inner wall acceleration, group: motion, scope: process, type: float, unit: mm/s2, pilot: edit, bounds: {min: 0, max: 50000}}
  - {key: top_surface_acceleration, label: Top surface acceleration, group: motion, scope: process, type: float, unit: mm/s2, pilot: edit, bounds: {min: 0, max: 50000}}
  - {key: sparse_infill_acceleration, label: Sparse infill acceleration, group: motion, scope: process, type: percent_or_mm_s2, pilot: edit}
  - {key: initial_layer_acceleration, label: First layer acceleration, group: motion, scope: process, type: float, unit: mm/s2, pilot: edit, bounds: {min: 0, max: 20000}}
  - {key: travel_acceleration, label: Travel acceleration, group: motion, scope: process, type: float, unit: mm/s2, pilot: edit, bounds: {min: 0, max: 50000}}
  - {key: default_jerk, label: Default jerk, group: motion, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 0, max: 50}}
  - {key: accel_to_decel_enable, label: Limit accel to decel, group: motion, scope: process, type: bool, pilot: edit, note: "Klipper only"}
  - {key: machine_max_acceleration_extruding, label: Machine max acceleration, group: motion, scope: machine, type: float, unit: mm/s2, pilot: read}
  - {key: machine_max_speed_x, label: Machine max X speed, group: motion, scope: machine, type: float, unit: mm/s, pilot: read}


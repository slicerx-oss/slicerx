  - {key: outer_wall_speed, label: Outer wall speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 1000}}
  - {key: inner_wall_speed, label: Inner wall speed, group: speed, scope: process, type: float, unit: mm/s, pilot: edit, bounds: {min: 5, max: 1000}}

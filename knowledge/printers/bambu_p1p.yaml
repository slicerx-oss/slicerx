kind: printer
schema_version: 1
id: bambu_p1p
name: Bambu Lab P1P
vendor: Bambu Lab
status: discontinued
status_note: "Not in the Bambu US store new printer list in 2026-09."
status_confidence: medium
status_src: [bambu_store_collection]
firmware: bambu
connections: [bambu_lan_mqtt, bambu_cloud, bambu_connect]
kinematics: corexy
build_volume_mm: {x: 256, y: 256, z: 256, printable_z_default: 250, src: [bambu_spec_p1p, "orca:BBL/machine/Bambu Lab P1P 0.4 nozzle.json"]}
extruder: {type: direct_drive, gears: steel, src: [bambu_spec_p1p]}
hotend:
  max_temp_c: 300
  nozzle_diameters_mm: [0.2, 0.4, 0.6, 0.8]
  nozzle_materials: [stainless_steel, hardened_steel]
  stock_nozzle: {diameter_mm: 0.4, material: stainless_steel}
  tool_free_swap: false
  high_flow_option: null
  max_flow_mm3s: {value: 32, note: "Bambu test: 150 x 150 mm single wall, Bambu ABS at 280 C."}
  src: [bambu_spec_p1p, bambu_wiki_hotend_x1]
bed:
  max_temp_c: 100
  plates: [textured_pei, bambu_cool_plate, bambu_engineering_plate, bambu_high_temp_plate, bambu_supertack_plate]
  included_plates: [textured_pei]
  src: [bambu_spec_p1p, bambu_store_p1s, bambu_wiki_build_plates]
enclosure:
  type: open
  chamber_heating: none
  max_chamber_c: null
  filtration: []
  optional_parts: [enclosure_panels, auxiliary_fan_kit, carbon_filter_kit]
  src: [bambu_spec_p1p, bambu_store_p1s]
  note: "Open frame with printable modplate panels. Auxiliary part cooling fan, control board fan, chamber regulator fan and air filter are optional. Orca marks no auxiliary fan."
motion:
  max_speed_mm_s: 500
  max_accel_mm_s2: 20000
  input_shaping: auto
  src: [bambu_spec_p1p, bambu_wiki_p1_intro]
power:
  mains: "100 to 240 V AC, 50/60 Hz"
  max_w: {value: 1000, note: "At 220 V. 350 W at 110 V.", src: [bambu_spec_p1p], confidence: high}
  printing_typical_w: {pla: {value: 110}, abs: {value: 170}, pc: {value: 160}, src: [bambu_wiki_power], confidence: medium, note: "Bambu wiki average power over a short test print (about 16 minutes)."}
  idle_w: {range: [4.8, 5.1], src: [bambu_wiki_power], confidence: medium, note: "Bambu wiki reading without network connection. 5 to 5.6 W with Wi-Fi."}
  measured_examples:
    - {job: "Bambu wiki test print, PLA, 16 min 34 s", kwh_range: [0.027, 0.035], src: [bambu_wiki_power]}
    - {job: "Bambu wiki test print, ABS, 16 min 3 s", kwh_range: [0.043, 0.057], src: [bambu_wiki_power]}
sensors: [chamber_camera, filament_runout, filament_odometry_with_ams, power_loss_recovery]
sensors_src: [bambu_spec_p1p, bambu_wiki_p1_intro]
builtin_calibrations:
  - {id: flow_dynamics, what: "Manual K pattern only.", src: [bambu_wiki_flow_dynamics]}
  - {id: bed_leveling, what: "Auto bed leveling and auto Z offset adjustment.", src: [bambu_wiki_p1_intro]}
  - {id: vibration_compensation, what: "Vibration suppression calibration.", src: [bambu_wiki_printer_calibration]}
multi_material:
  - {system: bambu_ams, max_units: 4, slots_per_unit: 4, needs: "filament buffer for one unit or AMS Hub for more", src: [bambu_wiki_ams_compat]}
  - {system: bambu_ams_2_pro, max_units: 4, slots_per_unit: 4, src: [bambu_wiki_ams_compat]}
  - {system: bambu_ams_ht, max_units: 4, slots_per_unit: 1, src: [bambu_wiki_ams_compat]}
  - {system: bambu_ams_lite, compatible: false, src: [bambu_wiki_amslite_intro]}
materials:
  recommended: [pla, pla_plus, pla_silk, pla_matte, petg, tpu_95a, pva, bvoh]
  possible: [abs, asa, pc, pa6, pa12, tpu_85a]
  not_recommended: [pla_cf, petg_cf, pa_cf, pa_gf]
  unlisted: [hips, pp]
  src: [bambu_spec_p1p, bambu_wiki_material_table]
  note: "Spec: PLA, PETG, TPU, PVA, PET ideal; PA, PC, ABS, ASA capable; carbon or glass fiber not recommended. Bambu's table marks ABS, ASA, PC and PA as not recommended on open frame printers."
orca_profile: "orca:BBL/machine/Bambu Lab P1P 0.4 nozzle.json"
profile_baseline:
  process: "0.20mm Standard @BBL P1P"
  values: {wall_loops: 2, top_shell_layers: 5, bottom_shell_layers: 3, sparse_infill_density: "15%", outer_wall_speed: 200, inner_wall_speed: 300, sparse_infill_speed: 270, travel_speed: 500, default_acceleration: 10000, retraction_length: 0.8, z_hop: 0.4}
  src: ["orca:BBL/process/0.20mm Standard @BBL P1P.json", "orca:BBL/machine/Bambu Lab P1P 0.4 nozzle.json"]
pilot_notes:
  - "Open frame. Warn before ABS, ASA, PC and nylon: they curl and split without an enclosure. Offer PETG or an enclosure kit first."
  - "No auxiliary part cooling fan by default. Overhangs and bridges in PLA cool worse than on the P1S. Suggest slower overhangs or the auxiliary fan kit."
  - "No lidar and no auto flow dynamics. Use the manual K pattern."
  - "The heatbed tops out at 100 C."
  - "Stock nozzle is stainless steel. Block fiber filled filament until a hardened hotend is fitted."
common_issues:
  - symptom: "ABS or ASA parts warp and split"
    cause: "Open frame loses heat and drafts hit the print."
    fix:
      - {advice: "Print ABS or ASA only with an enclosure kit, or switch to PETG.", kind: hardware}
      - {key: brim_type, op: set, value: outer_only, why: "A brim holds corners down on a cold chamber."}
    src: [bambu_wiki_material_table, bambu_spec_p1p]
  - symptom: "Poor bridges and overhangs on PLA"
    cause: "No auxiliary part cooling fan."
    fix:
      - {key: overhang_fan_speed, op: at_least, value: 100, why: "Use all the cooling the printer has on overhangs."}
      - {key: bridge_speed, op: decrease_by, value: 10, why: "Slower bridges give the single fan time to set the plastic."}
    src: [bambu_spec_p1p, "orca:BBL/machine/Bambu Lab P1P 0.4 nozzle.json"]
src: [bambu_spec_p1p, bambu_store_p1s, "orca:BBL/machine/Bambu Lab P1P 0.4 nozzle.json"]

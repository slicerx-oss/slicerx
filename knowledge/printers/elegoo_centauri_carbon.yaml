  src: [elegoo_cc_page, elegoo_cc_review_toms]
orca_profile: "orca:Elegoo/machine/ECC/Elegoo Centauri Carbon 0.4 nozzle.json"
profile_baseline:
  process: "0.20mm Standard @Elegoo CC 0.4 nozzle"
  values: {layer_height: 0.2, initial_layer_print_height: 0.2, outer_wall_speed: 160, inner_wall_speed: 200, sparse_infill_speed: 200, top_surface_speed: 200, initial_layer_speed: 50, travel_speed: 500, default_acceleration: 10000, outer_wall_acceleration: 5000, initial_layer_acceleration: 500, wall_loops: 2, top_shell_layers: 5, bottom_shell_layers: 3, sparse_infill_density: "15%", bridge_speed: 50, line_width: 0.42, retraction_length: 0.8}
  confidence: high
  note: "Orca's Elegoo profile sets inner wall and travel acceleration to 0, which means fall back to the default of 10000."
  src: ["orca:Elegoo/process/ECC/0.20mm Standard @Elegoo CC 0.4 nozzle.json", "orca:Elegoo/machine/ECC/Elegoo Centauri Carbon 0.4 nozzle.json"]
pilot_notes:
  - "Firmware status is contested and I could only confirm it through reporting and community docs, not a manufacturer statement. Reported: stock Elegoo OS is a heavily modified Klipper; Elegoo released source only after community pressure and the release raised license questions (All3DP). Moonraker, Fluidd and macro access are not offered by stock firmware."
  - "Community firmware exists: OpenCentauri COSMOS (full Klipper and Kalico replacement on the stock mainboard) and a patched Elegoo firmware. These are unofficial, flashing carries brick and warranty risk, and mimir must not walk a user through flashing without saying so."
  - "On stock firmware do not offer Klipper macro or Moonraker automation. Print start behavior is fixed; send G-code from Orca using Elegoo's LAN protocol or file transfer."
  - "Slicer G-code flavor is klipper in Orca but stock start G-code is vendor controlled. Keep machine_start_gcode unchanged unless the user runs COSMOS."
  - "No chamber heater: do not set chamber_temperature."
common_issues:
  - symptom: "Ringing or ghosting on fast prints"
    cause: "Default accelerations are high for the lightweight gantry."
    fix:
      - {key: outer_wall_acceleration, op: at_most, value: 3000, why: "Lower outer wall acceleration to clean up ringing."}
  - symptom: "PLA jams after long ABS runs"
    cause: "Enclosed chamber heat soak."
    fix:
      - {advice: "Open the lid and let the chamber cool for PLA.", kind: environment}
  - symptom: "Cannot reach Moonraker or Fluidd"
    cause: "Stock firmware does not expose them."
    fix:
      - {advice: "Use Elegoo's own app or LAN upload. Moonraker access needs community firmware such as OpenCentauri COSMOS, at the user's own risk.", kind: workflow}
src: [elegoo_cc_page, elegoo_cc_review_toms, opencentauri_docs, all3dp_cc_firmware, "orca:Elegoo/machine/ECC/Elegoo Centauri Carbon 0.4 nozzle.json"]

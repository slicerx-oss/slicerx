kind: printer
schema_version: 1
id: voron_trident
name: Voron Trident
vendor: Voron Design (self built)
status: current
firmware: klipper
connections: [moonraker]
kinematics: corexy
build_volume_mm: {x: 300, y: 300, z: 250, confidence: medium, note: "Kit sizes are 250x250x250, 300x300x250 and 350x350x250. This file models the 300. Z height is limited by the three lead screw bed design.", src: [voron_comparison_2_4_trident, "orca:Voron/machine/Voron Trident 300 0.4 nozzle.json"]}
extruder: {type: direct_drive, note: "Stealthburner toolhead with Clockwork 2 is the stock design; builders can swap it.", src: [voron_docs_home]}
hotend:
  max_temp_c: 300
  nozzle_diameters_mm: [0.15, 0.2, 0.25, 0.4, 0.5, 0.6, 0.8, 1.0]
  nozzle_materials: [brass, copper_plated, hardened_steel]
  stock_nozzle: "0.4 mm, depends on the builder's hotend"
  tool_free_swap: false
  high_flow_option: true
  confidence: low
  note: "Builder's choice of hotend. Read max_temp from the user's printer.cfg."
  src: [voron_docs_home, "orca:Voron/machine/Voron Trident 300 0.4 nozzle.json"]
bed:
  max_temp_c: 110
  plates: [textured_pei, smooth_pei, satin_pei]
  confidence: low
  note: "Typical mains silicone or aluminum heater with magnetic PEI sheet. Depends on the build."
  src: [voron_docs_home]
enclosure:
  type: enclosed
  chamber_heating: passive
  max_chamber_c: null
  filtration: [activated_carbon_optional]
  confidence: medium
  note: "Fully enclosed, passive chamber warmth from the bed. Active chamber heaters are common mods."
  src: [voron_docs_home]
motion:
  max_speed_mm_s: 500
  max_accel_mm_s2: 20000
  input_shaping: manual
  confidence: medium
  note: "Orca profile limits 500 mm/s and 20000 mm/s2. The fixed gantry can be stiffer than a 2.4, but the real limit is the resonance test result."
  src: ["orca:Voron/machine/Voron Trident 300 0.4 nozzle.json", klipper_docs_measuring_resonances, voron_comparison_2_4_trident]
power:
  psu_rated_w: {value: 200, note: "The assembly manual names the Mean Well LRS-200-24. The 200 W rating comes from the model number. Builders may fit a larger 24 V supply.", src: [voron_manual_trident], confidence: medium}
  note: "Depends on the build. The bed heater runs from mains AC through an SSR, not from the 24 V supply, and the Voron docs give no bed wattage. Ask the user for the heater rating. The manual has a supply voltage selector switch that must match local mains."
  src: [voron_manual_trident, voron_docs_electrical]
sensors: [inductive_probe_or_klicky, filament_runout_optional, chamber_thermistor_optional, accelerometer_optional]
builtin_calibrations:
  - {id: z_tilt_adjust, what: "Z_TILT_ADJUST levels the bed on its three lead screws before each print.", src: [voron_comparison_2_4_trident]}
  - {id: shaper_calibrate, what: "Klipper resonance test with an accelerometer.", src: [klipper_docs_measuring_resonances]}
  - {id: pressure_advance_tower, what: "TUNING_TOWER with SET_PRESSURE_ADVANCE.", src: [klipper_docs_pressure_advance]}
multi_material: []
materials:
  recommended: [pla, pla_plus, petg, abs, asa, pc, pa6, pa12, pa_cf, pa_gf, petg_cf, pla_cf, tpu_95a]
  possible: [tpu_85a, hips, pp, pla_silk, pla_matte, pva, bvoh]
  not_recommended: []
  confidence: low
  note: "Same as the 2.4: enclosed and heat capable. PLA and TPU need the door or lid opened. Abrasive filaments need a hardened nozzle."
  src: [voron_docs_home]
orca_profile: "orca:Voron/machine/Voron Trident 300 0.4 nozzle.json"
profile_baseline:
  process: "0.20mm Standard @Voron"
  values: {layer_height: 0.2, initial_layer_print_height: 0.2, outer_wall_speed: 120, inner_wall_speed: 200, sparse_infill_speed: 200, top_surface_speed: 100, initial_layer_speed: 50, travel_speed: 350, default_acceleration: 5000, outer_wall_acceleration: 3000, inner_wall_acceleration: 5000, travel_acceleration: 7000, initial_layer_acceleration: 500, wall_loops: 3, top_shell_layers: 4, bottom_shell_layers: 3, sparse_infill_density: "15%", bridge_speed: 25, line_width: 0.4, retraction_length: 0.8}
  confidence: medium
  src: ["orca:Voron/process/0.20mm Standard @Voron.json", "orca:Voron/machine/Voron Trident 300 0.4 nozzle.json"]
pilot_notes:
  - "Max print height is 250 mm on the Trident. Reject taller models early."
  - "Every Voron differs. Read real limits and hotend max_temp from Klipper before raising speeds or temperatures."
  - "PRINT_START must accept bed and nozzle temperature arguments; the machine_start_gcode in Orca must match its parameter names."
  - "Klipper G-code flavor. Avoid setting pressure advance twice (macro and slicer)."
  - "Heat soak ABS and ASA before printing. Reachable through Moonraker."
common_issues:
  - symptom: "First layer varies across the bed"
    cause: "Bed not tilted flat or mesh stale."
    fix:
      - {advice: "Run Z_TILT_ADJUST and a fresh bed mesh after heat soak.", kind: workflow}
  - symptom: "Ringing after raising acceleration"
    cause: "Acceleration above what the shaper cleans up."
    fix:
      - {key: outer_wall_acceleration, op: at_most, value: 3000, why: "Baseline outer wall acceleration for this profile."}
      - {advice: "Rerun SHAPER_CALIBRATE and cap max_accel at its recommendation.", kind: hardware}
  - symptom: "ABS splits or warps"
    cause: "Cold chamber and strong cooling."
    fix:
      - {key: fan_max_speed, op: at_most, value: 20, why: "Less cooling keeps ABS layers fused."}
      - {advice: "Heat soak the chamber before printing.", kind: workflow}
src: [voron_docs_home, voron_comparison_2_4_trident, "orca:Voron/machine/Voron Trident 300 0.4 nozzle.json"]

kind: sources
sources:
  - {id: bambu_wiki_abs_asa_pc, title: "ABS / ASA / PC Usage Guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament/abs_asa_pc", retrieved: 2026-09-29, note: "Drying table, glue requirement, warping causes, brim and chamber advice, filtration note. Lists PC HDT 117 C at 0.45 MPa."}
  - {id: bambu_wiki_absgf_pa6gf, title: "ABS GF / PA6 GF Glass Fiber Filament Usage Guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament/absgf_pa6gf", retrieved: 2026-09-29, note: "0.6 mm nozzle recommended, hardened steel or tungsten carbide, glue stick, drying table (PA6-GF 80 C 8 to 12 h oven, 85 C 12 h AMS HT), max volumetric flow 10.5 mm3/s."}
  - {id: bambu_wiki_asacf_pahtcf, title: "ASA CF / PAHT CF Usage Guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament/asacf_pahtcf", retrieved: 2026-09-29, note: "PAHT-CF HDT 194 C at 0.45 MPa, hardened nozzle, 0.6 mm recommended."}
  - {id: bambu_wiki_x1e_chamber, title: "X1E chamber temperature setting guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/manual/X1E-chamber-temp-guide", retrieved: 2026-09-29, note: "Max chamber 60 C on X1E. ABS and ASA default off (0 C) because air filtration gets worse when chamber heating is on; PC, PA, PA-CF, PAHT-CF default on (60 C)."}
  - {id: bambu_h2d_tech_specs, title: "H2D technical specifications", publisher: Bambu Lab, type: manufacturer_spec, url: "https://bambulab.com/en/h2d/tech-specs", retrieved: 2026-09-29, note: "Active chamber heating up to 65 C."}
  - {id: bambu_tds_abs_v3, title: "Bambu Filament Technical Data Sheet V3.0 ABS", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/abs-asa-pc/bambu_abs_technical_data_sheet_v3.pdf", retrieved: 2026-09-29, note: "HDT 84 C at 1.8 MPa and 87 C at 0.45 MPa, Vicat 94 C, chamber 45 to 60 C, annealing 80 to 90 C for 6 to 12 h."}
  - {id: bambu_tds_asa_v3, title: "Bambu Filament Technical Data Sheet V3.0 ASA", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/abs-asa-pc/6eaf4c432d1d4014a1975e55a55ed00b.pdf", retrieved: 2026-09-29, note: "HDT 92 C at 1.8 MPa and 100 C at 0.45 MPa, Vicat 106 C, nozzle 240 to 270, bed 80 to 100, chamber 45 to 60 C, annealing 80 to 90 C for 6 to 12 h."}
  - {id: bambu_tds_pc_v2, title: "Bambu Filament Technical Data Sheet V2.0 PC", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/abs-asa-pc/a52afdccddfd448583d119587122c8c5.pdf", retrieved: 2026-09-29, note: "Nozzle 260 to 280, bed 90 to 110, PVP glue, chamber 45 to 60 C, Tg 145 C, water absorption 0.25 percent. HDT printed 117 C at 1.8 MPa and 112 C at 0.45 MPa (values look swapped; the wiki page lists 117 C at 0.45 MPa)."}
  - {id: bambu_tds_paht_cf_v3, title: "Bambu Filament Technical Data Sheet V3.0 PAHT-CF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/asacf-pahtcf/65f1b18a6d6142d794a1a6a00f1496ef.pdf", retrieved: 2026-09-29, note: "HDT 170 C at 1.8 MPa and 194 C at 0.45 MPa, nozzle 260 to 290, bed 80 to 100, fan 0 to 40 percent, chamber 45 to 60 C, annealing 80 to 130 C for 6 to 12 h, water absorption 0.88 percent."}
  - {id: bambu_tds_pa6_cf_v3, title: "Bambu Filament Technical Data Sheet V3.0 PA6-CF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/petcf-ppacf/c750bddfb8e44af6ae9f7dd9625fa458.pdf", retrieved: 2026-09-29, note: "HDT 164 C at 1.8 MPa and 186 C at 0.45 MPa, nozzle 260 to 290, bed 80 to 100, fan 0 to 60 percent, 0.6 mm recommended, water absorption 2.35 percent, annealing 80 to 130 C."}
  - {id: bambu_tds_pa6_gf_v1, title: "Bambu Filament Technical Data Sheet V1.0 PA6-GF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/absgf-pa6gf/bambu_pa6-gf_technical_data_sheet.pdf", retrieved: 2026-09-29, note: "HDT 158 C at 1.8 MPa and 182 C at 0.45 MPa, nozzle 260 to 290, bed 80 to 100, speed under 130 mm/s, water absorption 2.56 percent, annealing 80 to 130 C for 6 to 12 h."}
  - {id: prusa_kb_asa, title: "ASA", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/asa_1809", retrieved: 2026-09-29, note: "260 C nozzle, 105 first layer then 110 C bed, enclosure for large parts, styrene fumes, heat resistance up to 93 C, smooth or powder coated PEI with glue stick."}
  - {id: prusa_kb_abs, title: "ABS", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/abs_2058", retrieved: 2026-09-29, note: "255 C nozzle, 100 C bed (80 to 110), 1 to 2 percent shrinkage, draft shield, no UV resistance."}
  - {id: prusa_kb_pc, title: "Polycarbonate (PC)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/polycarbonate-pc_165812", retrieved: 2026-09-29, note: "275 C nozzle, 110 then 115 C bed, powder coated sheet with glue stick, avoid smooth PEI, hygroscopic, PC Blend easier, ambient must be above 18 C."}
  - {id: prusa_kb_nylon, title: "Polyamide (Nylon)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/polyamide-nylon_167188", retrieved: 2026-09-29, note: "285 C nozzle, 110 C bed, dry at least 4 h below 90 C, PA Nylon sheet, enclosure helps, carbon fiber variants warp far less."}
  - {id: prusa_kb_pp, title: "Polypropylene (PP)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/polypropylene-pp_167126", retrieved: 2026-09-29, note: "220 to 270 C nozzle, 85 to 100 C bed, Prusa PP sheet or smooth PEI with PP tape, enclosure, brim 5 to 10 mm."}
  - {id: prusa_kb_hips, title: "HIPS", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/hips_167118", retrieved: 2026-09-29, note: "225 to 255 C nozzle, 100 to 110 C bed, limonene 10 to 20 s then dry 24 h, shrinks much less than ABS."}
  - {id: prusa_blog_core_one_intro, title: "Introducing Prusa CORE One", publisher: Prusa Research, type: manufacturer_blog, url: "https://blog.prusa3d.com/introducing-prusa-core-one-fully-enclosed-corexy-3d-printer-with-active-temperature-control_105477/", retrieved: 2026-09-29, note: "Chamber reaches 55 C with active temperature control, at maximum bed temperature."}
  - {id: polymaker_pis_pa12_cf, title: "PolyMide PA12-CF Industrial product information sheet", publisher: Polymaker, type: manufacturer_tds, url: "https://polymaker.com/wp-content/tech-docs/PolyMide_PA12-CF_PIS_EN_V1.pdf", retrieved: 2026-09-29, note: "Nozzle 260 to 300, bed and chamber 25 to 50 C (do not exceed 50), fan off, 30 to 60 mm/s, PVP or Magigoo PA glue, anneal 80 C for 6 h (HDT 105 C at 1.8 MPa after annealing), dry 80 C for 12 h."}
  - {id: polymaker_tds_copa, title: "PolyMide CoPA technical data sheet", publisher: Polymaker, type: manufacturer_tds, url: "https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/nylon/polymide-tm-copa", retrieved: 2026-09-29, note: "PA6/66 copolymer. Nozzle 250 to 270, bed 25 to 50, closed chamber at ambient, dry 100 C for 8 h, anneal 80 C for 6 h, HDT 70 C at 1.8 MPa and 111 C at 0.45 MPa, density 1.12."}
  - {id: polymaker_pis_polylite_asa, title: "PolyLite ASA product information sheet", publisher: Polymaker, type: manufacturer_tds, url: "https://polymaker.com/wp-content/tech-docs/PolyLite_ASA_PIS_EN_V1.3.pdf", retrieved: 2026-09-29, note: "Nozzle 240 to 260, bed 75 to 95, fan off, brim or raft, enclosure recommended, Tg 97.8 C, Vicat 105.3 C."}
  - {id: polymaker_pis_polylite_abs, title: "PolyLite ABS product information sheet", publisher: Polymaker, type: manufacturer_tds, url: "https://polymaker.com/wp-content/tech-docs/PolyLite_ABS_PIS_EN_V1.2.pdf", retrieved: 2026-09-29, note: "Nozzle 245 to 265, bed 90 to 100, fan off, brim or raft, enclosure recommended, Tg 101 C, Vicat 104 C."}
  - {id: polymaker_wiki_by_material, title: "Printing tips by material type", publisher: Polymaker, type: manufacturer_wiki, url: "https://wiki.polymaker.com/printing-tips/by-material-type", retrieved: 2026-09-29, note: "PP: PP sheet or cardboard, bed 80 to 100. Nylon: garolite or PVA glue, dry the filament. PC: enclosure at 50 to 60 C ambient, slow cooling to avoid cracking."}
  - {id: polymaker_wiki_nylon_types, title: "Types of nylon used in FDM 3D printing", publisher: Polymaker, type: manufacturer_wiki, url: "https://wiki.polymaker.com/the-basics/fun-3d-printing-facts/types-of-nylon-used-in-fdm-3d-printing", retrieved: 2026-09-29, note: "PA6 250 to 270 C, warps unless heated bed and enclosure. PA66 about 260 C, bed 80 to 100 C. PA12 240 to 260 C, lower moisture absorption and fewer warping issues than PA6 and PA66. No numeric absorption figures."}

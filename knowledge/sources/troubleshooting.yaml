# Sources for knowledge/workflows/troubleshooting/*.yaml
kind: sources
sources:
  # Bambu Lab wiki
  - {id: bambu_wiki_ams_loading, title: "AMS filament loading and unloading failure troubleshooting", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/troubleshooting/ams-loading-unloading-failure", retrieved: 2026-09-29, note: "AMS and AMS lite: pre-loading, RFID read, feeder, hub sensor, odometer, slipping in the hub (tighten the 4 screws, try another spool)."}
  - {id: bambu_wiki_ams2pro_loading, title: "AMS 2 Pro filament loading and unloading failure troubleshooting", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-2-pro/troubleshooting/loading-unloading-failure", retrieved: 2026-09-29, note: "Feeder unit, internal hub, PTFE between AMS and buffer and toolhead, worn filament, external spool test to separate AMS from nozzle clogs."}
  - {id: bambu_wiki_ams_lite_hub_tube, title: "Fix the AMS lite filament hub and 4-in-1 PTFE adapter not holding the tube", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1/troubleshooting/ams-lite-filament-hub-cannot-hold-tube", retrieved: 2026-09-29, note: "Only the page title and search summary were read."}
  - {id: bambu_wiki_hms_0700_4000_0002_0004, title: "HMS_0700-4000-0002-0004 filament buffer signal abnormal", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/troubleshooting/hmscode/0700_4000_0002_0004", retrieved: 2026-09-29, note: "Buffer has a slide, spring and hall sensor. Stuck spring or tangled filament or stuck spool."}
  - {id: bambu_wiki_hms_0700_2000_0002_0014, title: "HMS_0700-2000-0002-0014 AMS slot odometer no signal", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/troubleshooting/hmscode/0700_2000_0002_0014", retrieved: 2026-09-29}
  - {id: bambu_wiki_hms_0700_0100_0002_0011, title: "HMS_0700-0100-0002-0011 AMS motor assist parameter lost", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/troubleshooting/hmscode/0700_0100_0002_0011", retrieved: 2026-09-29, note: "Pull the filament out of the hub and restart the AMS."}
  - {id: bambu_wiki_hms_1200_2000_0002_0006, title: "HMS_1200-2000-0002-0006 failed to extrude AMS lite filament, air printing detection", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1-mini/troubleshooting/hmscode/1200_2000_0002_0006", retrieved: 2026-09-29, note: "A1 series with AMS lite compares extruder distance with the AMS odometer; on air printing it cuts the filament and pauses."}
  - {id: bambu_wiki_hms_0300_0900_0002_0004, title: "HMS_0300-0900-0002-0004 extrusion resistance abnormal", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/p2s/troubleshooting/hmscode/0300_0900_0002_0004", retrieved: 2026-09-29, note: "Causes: jam in the toolhead, clogged nozzle, filament type mismatch with the slicer, tangled external spool."}
  - {id: bambu_wiki_hms_0300_1A00_0002_0002, title: "HMS_0300-1A00-0002-0002 extrusion force sensor detects nozzle clog", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1-mini/troubleshooting/hmscode/0300_1A00_0002_0002", retrieved: 2026-09-29}
  - {id: bambu_wiki_hms_0300_0A00_0001_0004, title: "HMS_0300-0A00-0001-0004 external disturbance on the heatbed during force sensor test", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/troubleshooting/hmscode/0300_0A00_0001_0004", retrieved: 2026-09-29, note: "Build plate not seated, printer on an unstable surface, or debris under the plate."}
  - {id: bambu_wiki_filament_sensor_test, title: "Filament sensor inspection guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/troubleshooting/filament-sensor-test", retrieved: 2026-09-29}
  - {id: bambu_wiki_first_layer_x1, title: "X1/P1 first layer print quality improvement guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/troubleshooting/first-layer-printing-optimization-guide", retrieved: 2026-09-29, note: "Re-tighten the two hotend screws, clean the plate, run auto bed leveling, then adjust the G29.1 Z offset. Suggested range -0.06 to 0 mm on textured plates and -0.01 to 0.01 mm on smooth plates. Default G29.1 Z-0.04 on textured."}
  - {id: bambu_wiki_warping_p2s, title: "P2S/X2D model warping troubleshooting", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x2d/troubleshooting/preventing-warping-p2s-x2d", retrieved: 2026-09-29, note: "Basic checks: clean plate, match plate type, dry filament, first layer quality. Cold chamber air on the part drives warping."}
  - {id: bambu_wiki_avoid_clogs, title: "How to avoid nozzle clogs", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/how_to_avoid_nozzle_clogs", retrieved: 2026-09-29, note: "Filament diameter 1.75 plus or minus 0.03 mm, store and dry, high to low temperature material switch procedure (250 to 300 C purge then 220 to 240 C), open the door for PLA and PETG, worn heater cartridge."}
  - {id: bambu_wiki_heat_creep, title: "What is heat creep?", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/heat-creep", retrieved: 2026-09-29, note: "Keep chamber at least 10 C below the filament glass transition. Table of bed temperatures and whether to remove the top glass. Failing hotend fan or hot room causes the heatsink to overheat."}
  - {id: bambu_wiki_a1_nozzle_clog, title: "A1 and A1 mini nozzle and hotend unclogging procedure", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1-mini/troubleshooting/nozzle-clog", retrieved: 2026-09-29, note: "Partial clog signs: filament curls and does not exit straight, inconsistent flow dynamics K value. Manual extrude, pin tool, cold pull."}
  - {id: bambu_wiki_layer_artifacts, title: "Troubleshooting and solutions for 3D printing layer lines", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/print-quality/severe-layer-artifacts", retrieved: 2026-09-29, note: "Cross section ridges after bridges, local warping bulges, flow change lines, filament diameter or moisture problems."}
  - {id: bambu_wiki_layer_shifts, title: "Layer shifts", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/layer-shifts", retrieved: 2026-09-29, note: "Causes: interference from purge chute waste or cables, nozzle striking warped part, speed too high or Ludicrous mode change mid print, dirty carbon rods. Auto-recovery from step loss option."}
  - {id: bambu_wiki_spaghetti, title: "Troubleshooting spaghetti in 3D printing", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/print-quality/spaghetti", retrieved: 2026-09-29, note: "First layer spaghetti and mid print (warping, support collapse, nozzle scraping). Initial layer speed 30 mm/s or less and initial layer infill 60 mm/s or less. Brim 5 to 8 mm."}
  - {id: bambu_wiki_elephant_foot, title: "Elephant foot", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/parameter/elephant-foot", retrieved: 2026-09-29, note: "Caused by bed heat and weight of upper layers. Compensation shrinks the first layer contour. Test cube 25x25x10 mm, measure and enter the value."}
  - {id: bambu_wiki_xy_compensation, title: "XY hole and contour compensation", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/xy-hole-contour-compensation", retrieved: 2026-09-29, note: "Check shrinkage, elephant foot, wet filament, flow dynamics, hole size near nozzle size, seam and lack of chamfers before compensating. Calibrate per filament with an M6 screw hole test."}
  - {id: bambu_wiki_overhang, title: "How to print model overhangs", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/print-quality/overhang", retrieved: 2026-09-29, note: "Supports under 45 degrees, lower nozzle temperature about 5 to 10 C, PLA about 205 C with overhang fan 100 percent, slow down for overhangs."}
  - {id: bambu_wiki_motion_accuracy, title: "Motion accuracy calibration", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/manual/motion-accuracy", retrieved: 2026-09-29, note: "Only the page title and search summary were read."}
  # Prusa Knowledge Base
  - {id: prusa_kb_stringing, title: "Stringing and oozing", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/stringing-and-oozing_1805", retrieved: 2026-09-29, note: "Lower nozzle temperature 5 to 10 C, check retraction, avoid crossing perimeters, clean the nozzle after long PETG runs, try another spool for moisture, reapply thermal paste on the heatbreak threads."}
  - {id: prusa_kb_warping, title: "Warping", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/warping_2011", retrieved: 2026-09-29, note: "Clean plate with 90 percent IPA, do not over squish, check part fan, stable ambient, enclosure for ABS or ASA but not PLA or PETG, skirt or draft shield, slower speed, brim."}
  - {id: prusa_kb_ghosting, title: "Ghosting", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/ghosting_1801", retrieved: 2026-09-29, note: "Belt tension, MK3 belt status values 240 to 300 are fine, lower speed, firm surface."}
  - {id: prusa_kb_layer_separation, title: "Layer separation and splitting FDM", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/layer-separation-and-splitting-fdm_1806", retrieved: 2026-09-29, note: "Too much cooling or too cold. ABS needs fans off and an enclosure. PLA: raise temperature in 5 C steps. Raise extrusion multiplier in 5 percent steps."}
  - {id: prusa_kb_layer_shifting, title: "Layer shifting", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/layer-shifting_2020", retrieved: 2026-09-29, note: "Belt tension, pulley set screws aligned with the flat of the motor shaft, stealth mode off for large prints, free movement, cable bundle."}
  - {id: prusa_kb_poor_bridging, title: "Poor bridging", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/poor-bridging_1802", retrieved: 2026-09-29, note: "Lower bridge flow ratio, lower bridge speed, fan cooling, support enforcer halfway, reorient the part."}
  - {id: prusa_kb_first_layer, title: "First layer issues", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/first-layer-issues_1804", retrieved: 2026-09-29, note: "Clean with 90 percent IPA or dish soap, glue stick for PETG and PET based materials, nozzle too close or far, do not squish to fix adhesion, about 75 percent speed for the first three layers, bed 5 to 10 C hotter for stubborn materials, brim, partial clog."}
  - {id: prusa_kb_clogged_nozzle, title: "Clogged nozzle (CORE One, XL, MK4/S, MK3.9/S)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/clogged-nozzle-core-one-core-one-l-xl-mk4-s-mk3-9-s_411823", retrieved: 2026-09-29, note: "Signs: filament not exiting, partial clog with gaps and curling, loud clicking. Idler tension, feeding gear debris, cold pull."}
  - {id: prusa_kb_benchy_hull_line, title: "The Benchy hull line", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/the-benchy-hull-line_124745", retrieved: 2026-09-29, note: "Line at the infill to solid transition caused by abrupt layer time change, cooling and filament dryness. Not usually hardware."}
  - {id: prusa_kb_mmu_finda_stuck, title: "FINDA: filament stuck #04102 (MMU)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/finda-filament-stuck-04102-mmu_394505", retrieved: 2026-09-29, note: "Only the search summary was read."}
  - {id: prusa_kb_mmu_finda_no_trigger, title: "FINDA didn't trigger #04101 (MMU)", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/finda-didnt-trigger-04101-mmu_393894", retrieved: 2026-09-29, note: "Only the search summary was read."}
  - {id: prusa_kb_mmu_loading_failed, title: "MMU loading failed", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/mmu-loading-failed_2135", retrieved: 2026-09-29, note: "Only the search summary was read."}
  # Klipper docs
  - {id: klipper_resonance, title: "Resonance compensation", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/Resonance_Compensation.html", retrieved: 2026-09-29, note: "Ringing has mechanical origins first (frame rigidity, belts, alignment, moving mass). Ringing test tower, measure frequency, MZV or EI shaper. Resonance below about 20 to 25 Hz means stiffen the printer. Retune pressure advance after input shaping."}
  - {id: klipper_bed_mesh, title: "Bed mesh", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/Bed_Mesh.html", retrieved: 2026-09-29, note: "Mesh needs a calibrated probe Z offset and cannot fix mechanical or probe errors."}
  - {id: klipper_tmc_drivers, title: "TMC drivers", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/TMC_Drivers.html", retrieved: 2026-09-29, note: "Includes the 'Unable to read tmc uart' error and the stealthChop torque note."}
  - {id: klipper_faq, title: "Frequently asked questions", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/FAQ.html", retrieved: 2026-09-29, note: "Lost communication with MCU can come from serial interference on the host."}
  - {id: klipper_config_reference, title: "Configuration reference (verify_heater)", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/Config_Reference.html", retrieved: 2026-09-29, note: "Heater verification is enabled by default; max_error 120 default cumulative error."}
  - {id: klipper_slicers, title: "Slicers", publisher: Klipper project, type: firmware_docs, url: "https://www.klipper3d.org/Slicers.html", retrieved: 2026-09-29, note: "Do not enable coasting with Klipper, it makes blobbing worse. Retract and wipe are fine. Large retractions over 5 mm may need max_extrude_only_velocity tuning."}
  # Ellis' Print Tuning Guide
  - {id: ellis_layer_shifting, title: "Layer shifting", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/layer_shifting.html", retrieved: 2026-09-29, note: "Belt tension, belt routing and rubbing, z lift 0.2 to 0.3 mm, curling causing nozzle strikes, motor quality and current, wiring, stepper driver cooling."}
  - {id: ellis_extruder_skipping, title: "Extruder skipping", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html", retrieved: 2026-09-29, note: "Partial clog first, PLA in a hot enclosure, mark the motor shaft, grub screw, tensioner, reverse bowden, hotend fan at 100 percent, retraction 1 mm max on direct drive, hand extrusion should be easy."}
  - {id: ellis_retraction, title: "Retraction", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/retraction.html", retrieved: 2026-09-29, note: "Direct drive start 0.5 mm at 35 mm/s, stay under 1 mm. Bowden start 1 mm. Wet filament, backlash, loose nozzle or heatbreak leak, z hop 0.2 to 0.3 mm, PETG needs avoid crossing perimeters."}
  - {id: ellis_build_adhesion, title: "Build surface adhesion", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/build_surface_adhesion.html", retrieved: 2026-09-29, note: "Wash with dish soap, do not touch, first layer temperature PLA about 60, PETG about 80, ABS about 90 to 100 C, first layer width 120 percent, scuff smooth PEI."}
  - {id: ellis_first_layer_squish, title: "First layer squish", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/first_layer_squish.html", retrieved: 2026-09-29, note: "First layer height 0.25 mm or more, first layer width 120 percent or more, baby step Z live, lean toward slightly more squish."}
  - {id: ellis_first_layer_inconsistency, title: "First layer inconsistency", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/first_layer_squish_consistency_issues/first_layer_inconsistency.html", retrieved: 2026-09-29, note: "Bed mesh, hot mesh differs from cold mesh, gantry squaring, tight hotend and nozzle, bicubic algorithm, bed screws, Z belt tension."}
  - {id: ellis_perimeter_separation, title: "Perimeter separation", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/perimeter_separation.html", retrieved: 2026-09-29, note: "Elephant foot compensation set too high, line width stepover, extrusion multiplier, slower perimeters, hotter nozzle."}
  - {id: ellis_bulging, title: "Bulging", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/bulging.html", retrieved: 2026-09-29, note: "Outer wall first, lower perimeter accelerations, input shaper conflicts, solid infill overextrusion, pressure advance and extrusion multiplier."}
  - {id: ellis_pockmarks, title: "Pockmarks", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/pockmarks.html", retrieved: 2026-09-29, note: "Seam not random, dry filament, sealed spools can be wet, new nozzle."}
  - {id: ellis_cooling_layer_times, title: "Cooling and layer times", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/cooling_and_layer_times.html", retrieved: 2026-09-29, note: "Constant fan avoids banding, minimum layer time about 15 s for ABS, print multiple objects to add layer time, curling at low fan can be adhesion."}
  - {id: ellis_extrusion_multiplier, title: "Extrusion multiplier", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/extrusion_multiplier.html", retrieved: 2026-09-29, note: "Cube test with 1 to 2 percent steps, tune after extruder calibration and pressure advance. Has a dimensional accuracy section."}
  - {id: ellis_extrusion_patterns, title: "Extrusion patterns and wood grain", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extrusion_patterns.html", retrieved: 2026-09-29, note: "Extruder gear backlash and gear wear, filament tension screw, diagonal patterns can be axis mechanics."}
  - {id: ellis_vfas, title: "VFAs (vertical fine artifacts)", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/vfas.html", retrieved: 2026-09-29, note: "About 2 mm spacing points at belt, pulley or idler teeth. Belts too tight, rubbing, dirty pulleys, poor bearings. CoreXY belts about 110 Hz over 150 mm."}
  - {id: ellis_pla_overheating, title: "PLA is overheating", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/pla_overheating.html", retrieved: 2026-09-29}
  - {id: ellis_small_infill, title: "Small infill areas look overextruded", publisher: Ellis3DP (community), type: community_guide, url: "https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/small_infill_areas_overextruded.html", retrieved: 2026-09-29, note: "Some of this is normal. Lower top infill speed and acceleration, reduce pressure advance smooth time, check backlash."}
  # OrcaSlicer wiki
  - {id: orca_wiki_seam, title: "Seam settings and seam troubleshooting", publisher: OrcaSlicer project, type: slicer_docs, url: "https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_seam", retrieved: 2026-09-29, note: "Seam start blobs come from ooze after travel. Calibrate pressure advance, fast travel and travel acceleration, wipe before external perimeters, travel threshold 2 to 4 mm, scarf joint seam. Random seam is best for strength, aligned back or back for looks."}
  - {id: orca_wiki_precision, title: "Precision settings", publisher: OrcaSlicer project, type: slicer_docs, url: "https://github.com/OrcaSlicer/OrcaSlicer/wiki/quality_settings_precision", retrieved: 2026-09-29, note: "X-Y hole and contour compensation, elephant foot compensation, precise wall, polyholes."}
  # Low confidence sources
  - {id: creality_forum_cfs_buffer, title: "K2 Plus with CFS buffer issue", publisher: Creality, type: manufacturer_forum, url: "https://forum.creality.com/t/k2-plus-w-cfs-buffer-issue/49783", retrieved: 2026-09-29, note: "Community thread on the official Creality forum. Only the search summary was read. Low confidence for CFS steps."}
  - {id: anycubic_guide_z_banding, title: "Fixing Z banding and wobble", publisher: Anycubic, type: vendor_guide, url: "https://store.anycubic.com/blogs/3d-printing-guides/fix-z-banding-wobble", retrieved: 2026-09-29, note: "Vendor blog. Lead screw wobble and wear, roll the screw on a flat surface, lubrication, alignment. Low confidence; used because no manufacturer wiki covers it."}
  - {id: anycubic_guide_pillowing, title: "Preventing pillowing and rough top layer problems", publisher: Anycubic, type: vendor_guide, url: "https://store.anycubic.com/blogs/3d-printing-guides/fix-3d-print-pillowing", retrieved: 2026-09-29, note: "Vendor blog. More top layers, more infill density, top layer cooling. Low confidence."}

# Sources for Bambu Lab printers, AMS accessories and ecosystem guides.
kind: sources
sources:
  # Printer spec sheets
  - {id: bambu_spec_x1c, title: "X1-Carbon technical specifications", publisher: Bambu Lab, type: manufacturer_spec, url: "https://public-cdn.bambulab.com/store/bambulab-X1-carbon-tech-specs.pdf", retrieved: 2026-09-29, note: "One page spec sheet. Bed 110 C at 220 V and 120 C at 110 V."}
  - {id: bambu_spec_x1e, title: "X1E technical specification", publisher: Bambu Lab, type: manufacturer_spec, url: "https://cdn1.bambulab.com/x1e/spec/X1E%20Spec(EN).pdf", retrieved: 2026-09-29, note: "Active chamber heating to 60 C, 320 C hotend, Ethernet, HEPA H12 filter."}
  - {id: bambu_spec_p1s, title: "P1S technical specifications", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/default/9e9c1948dd61491199a52c3f1497b9c7/bambu-lab-P1S-tech-specs.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_p1p, title: "P1P technical specifications", publisher: Bambu Lab, type: manufacturer_spec, url: "https://public-cdn.bambulab.com/store/bambulab-P1P-tech-specs.pdf", retrieved: 2026-09-29}
  - {id: bambu_store_p1s, title: "P1S store page with P1P and P1S parameter comparison", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/p1s", retrieved: 2026-09-29, note: "Footnote: default printable height in Bambu Studio is 250 mm to protect the heatbed; the last 6 mm can be unlocked."}
  - {id: bambu_store_a1, title: "A1 specs", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/a1", retrieved: 2026-09-29, note: "Store table lists 10000 mm/s2 acceleration and 100 C bed. Orca machine profile uses 12000."}
  - {id: bambu_store_a1_mini, title: "A1 mini tech specs", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/a1-mini", retrieved: 2026-09-29, note: "Store table lists 10000 mm/s2 acceleration and 80 C bed. Orca machine profile uses 20000."}
  - {id: bambu_spec_h2d, title: "H2D spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/4731f4c55a/e8f62a86f5f24c42a764d3d528303526/TDS.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_h2s, title: "H2S and H2S Laser Edition spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/default/3f91ec86de1a4ce28fe8fb660b95cd3e/h2s.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_h2c, title: "H2C spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/default/d741f5a073c94245885065ff89a0b2da/H2C_Spec.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_p2s, title: "P2S spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/default/2d1a01cd2dca425eb071ccc28c26c9fa/spec.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_x2d, title: "X2D spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/default/9e5a2e55561347cba2838a0c98c15ace/X2D_spec.pdf", retrieved: 2026-09-29}
  - {id: bambu_spec_a2l, title: "A2L spec sheet", publisher: Bambu Lab, type: manufacturer_spec, url: "https://store.bblcdn.com/s7/mqxkp/c59dc3c5d00e4c8284872e2304018c4f/npdf.pdf", retrieved: 2026-09-29}
  - {id: bambu_store_collection, title: "Bambu Lab US store 3D printer collection", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/collections/3d-printer", retrieved: 2026-09-29, note: "Lists A1, A1 mini, A2L, H2C, H2D, H2S, P1S, P2S, X2D for new sale. X1C appears only as a refurbished product. X1E and P1P are not listed. Used for the status field, confidence medium."}
  # Wiki: hardware and calibration
  - {id: bambu_wiki_x1_intro, title: "X1 series introduction", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/manual/intro-x1", retrieved: 2026-09-29, note: "Describes Micro Lidar first layer inspection, AI spaghetti detection, vibration compensation."}
  - {id: bambu_wiki_p1_intro, title: "P1P and P1S introduction", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/p1/manual/intro-p1p", retrieved: 2026-09-29, note: "Vibration suppression, auto bed leveling, auto Z offset adjustment."}
  - {id: bambu_wiki_h2d_intro, title: "H2D introduction", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/manual/h2d-intro", retrieved: 2026-09-29}
  - {id: bambu_wiki_printer_calibration, title: "Printer auto calibration", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/general/printer-calibration", retrieved: 2026-09-29, note: "When to run bed leveling, vibration compensation and motor noise calibration."}
  - {id: bambu_wiki_flow_dynamics, title: "Flow dynamics calibration", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/calibration_pa", retrieved: 2026-09-29, note: "K factor, when to recalibrate, X1 lidar versus A1 and H2D eddy current sensor, about 10 percent run to run jitter, 0.2 mm nozzle caveat."}
  - {id: bambu_wiki_flow_rate_cal, title: "Flow rate calibration", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/calibration_flow_rate", retrieved: 2026-09-29, note: "Auto calibration is X1 series only. Manual coarse (80 to 120 percent, 5 percent steps) and fine modes."}
  - {id: bambu_wiki_lidar_flow, title: "Automatic flow calibration with Micro Lidar", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/flowrate-calibration-by-microlidar", retrieved: 2026-09-29, note: "Unsuitable finishes table: sparkle, marble, metal, silk, transparent, TPU."}
  - {id: bambu_wiki_manual_flow_rate, title: "Manual flow rate tuning (X1)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/manual/manual-flow-rate-tuning", retrieved: 2026-09-29}
  - {id: bambu_wiki_studio_calibration, title: "Bambu Studio calibration (developer mode tests)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/bambu-studio/Calibration", retrieved: 2026-09-29, note: "Rough pass formula: initial flow times (100 plus modifier) divided by 100."}
  - {id: bambu_wiki_nozzle_offset, title: "Nozzle offset calibration (H2 series and X2D)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/manual/nozzle-offset-calibration", retrieved: 2026-09-29, note: "Ideal left to right nozzle height difference is 5 mm. Run when layers shift after a nozzle switch. Settings, Print Calibration."}
  - {id: bambu_wiki_a1_clumping, title: "Nozzle clumping detection (A series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1-mini/manual/nozzle-warp-detection", retrieved: 2026-09-29}
  - {id: bambu_wiki_a_plate_detection, title: "Build plate position detection (A series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1-mini/manual/build-plate-detection", retrieved: 2026-09-29}
  - {id: bambu_wiki_h2_detection, title: "H2 intelligent detection (nozzle camera)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/manual/intelligent-detection", retrieved: 2026-09-29, note: "Nozzle camera detects nozzle clumping, air printing and spaghetti."}
  # Wiki: plates
  - {id: bambu_wiki_build_plates, title: "Build plates overview", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/acc/plates", retrieved: 2026-09-29, note: "Textured PEI, Smooth PEI, Dual-Texture, Engineering and Cool Plate SuperTack. Two plate generations differ by QR code."}
  - {id: bambu_wiki_supertack, title: "Bambu Cool Plate SuperTack", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/acc/bambu-cool-plate-supertack", retrieved: 2026-09-29, note: "PLA and PETG only. No TPU, no PLA Silk, no support for PLA/PETG. Do not use acetone."}
  - {id: bambu_wiki_glue, title: "How to use Bambu liquid glue", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/general/how-to-use-bbl-liquid-glue", retrieved: 2026-09-29, note: "Linked from the material table; glue temperature ranges come from bambu_wiki_material_table."}
  # Wiki: connectivity
  - {id: bambu_wiki_lan_mode, title: "Enable LAN mode", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/enable-lan-mode", retrieved: 2026-09-29, note: "LAN only turns off Handy, remote start from outside the LAN and print history. X series needs an SD card to start prints from Studio in LAN mode."}
  - {id: bambu_wiki_developer_mode, title: "Enable Developer mode", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/enable-developer-mode", retrieved: 2026-09-29}
  - {id: bambu_wiki_bambu_connect, title: "Bambu Connect", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-connect", retrieved: 2026-09-29, note: "Beta middleware. Imports 3MF or G-code, no live view yet. URL scheme bambu-connect://import-file."}
  - {id: bambu_wiki_third_party, title: "Third party integration", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/third-party-integration", retrieved: 2026-09-29, note: "Explains Developer Mode (no authorization, LAN only), Bambu Connect and the Bambu Local Server SDK."}
  - {id: hackaday_bambu_auth, title: "New Bambu Lab firmware update adds mandatory authorization control system", publisher: Hackaday, type: news, url: "https://hackaday.com/2025/01/17/new-bambu-lab-firmware-update-adds-mandatory-authorization-control-system/", retrieved: 2026-09-29, note: "Announcement dated 2025-01-16, beta firmware 01.08.03.00 on 2025-01-17."}
  - {id: simplyprint_bambu_auth, title: "Bambu Lab security firmware authorization control: will I still be able to use SimplyPrint", publisher: SimplyPrint, type: vendor_help, url: "https://help.simplyprint.io/en/article/bambu-lab-security-firmware-authorization-control-system-update-will-i-still-be-able-to-use-simplyprint-y2uoor/", retrieved: 2026-09-29, note: "Read access continues; start, stop, move and heat need Developer Mode plus LAN only on new firmware."}
  - {id: openbambuapi_mqtt, title: "OpenBambuAPI: MQTT", publisher: Doridian (community), type: community_docs, url: "https://github.com/Doridian/OpenBambuAPI/blob/main/mqtt.md", retrieved: 2026-09-29, note: "Local broker mqtt at printer IP port 8883 with TLS, user bblp, password is the LAN access code. Reverse engineered, not official."}
  - {id: openbambuapi_ftp, title: "OpenBambuAPI: FTP", publisher: Doridian (community), type: community_docs, url: "https://github.com/Doridian/OpenBambuAPI/blob/main/ftp.md", retrieved: 2026-09-29, note: "Implicit TLS FTPS on port 990, user bblp, password is the LAN access code."}
  # Wiki: timelapse
  - {id: bambu_wiki_timelapse_xp, title: "Time-lapse photography (X, P, H2 style series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/timelapse-xp-series", retrieved: 2026-09-29, note: "Smooth mode moves the toolhead to the purge chute to shoot and needs a prime tower. Print time increases."}
  - {id: bambu_wiki_timelapse_a, title: "Time-lapse photography (A series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/timelapse-a-series", retrieved: 2026-09-29, note: "Bed and toolhead move to a fixed position for every shot in both modes. Traditional mode hides ooze in infill."}
  - {id: bambu_wiki_timelapse_h2, title: "Time-lapse function (H2 series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/manual/time-lapse-function", retrieved: 2026-09-29, note: "Dual nozzle main nozzle logic; nozzles differ in height by about 5 mm."}
  # Wiki: AMS
  - {id: bambu_wiki_ams_function, title: "AMS function introduction", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/manual/ams-function-introduction", retrieved: 2026-09-29, note: "Preloading, RFID reading, remaining filament estimate, auto mapping, auto refill rules."}
  - {id: bambu_wiki_ams_compat, title: "Multi-model AMS compatibility guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/manual/multi-model-AMS-compatibility-guide", retrieved: 2026-09-29, note: "Unit counts per printer, buffers, hubs, cables, drying power rules."}
  - {id: bambu_wiki_ams2pro_intro, title: "AMS 2 Pro parts and connection guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-2-pro/manual/intro-and-connection-guide", retrieved: 2026-09-29}
  - {id: bambu_wiki_amsht_intro, title: "AMS HT parts and connection guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-ht/manual/intro-and-connection-guide", retrieved: 2026-09-29, note: "Single feeder, dedicated TPU outlet at the rear of the lid, needs external power for drying."}
  - {id: bambu_wiki_ams_drying, title: "AMS 2 Pro and AMS HT drying function", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-2-pro/manual/drying-function", retrieved: 2026-09-29, note: "AMS 2 Pro max 65 C (needs ambient at least 25 C for the max), AMS HT max 85 C with 170 W heater. Remove PLA and TPU before drying hotter materials."}
  - {id: bambu_wiki_ams_faq, title: "AMS 2 Pro and AMS HT FAQ", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/manual/ams-2-pro-ams-ht-faq", retrieved: 2026-09-29}
  - {id: bambu_wiki_amslite_intro, title: "AMS lite introduction", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-lite/manual/intro-ams-lite", retrieved: 2026-09-29}
  - {id: bambu_wiki_amslite_faq, title: "AMS lite FAQ", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams-lite/manual/faq", retrieved: 2026-09-29, note: "Spool width 40 to 68 mm, inner diameter 53 to 58 mm, no TPU softer than 77D, no third party CF or GF."}
  - {id: bambu_wiki_reduce_waste, title: "Reduce wasting during filament change", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/reduce-wasting-during-filament-change", retrieved: 2026-09-29, note: "Flushing volumes, multiplier, flush into infill, support and this object, prime tower."}
  - {id: bambu_wiki_multicolor, title: "Multi-color printing in Bambu Studio", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/multi-color-printing", retrieved: 2026-09-29}
  - {id: bambu_wiki_filament_mapping, title: "Filament mapping principle", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/filament-mapping-principle", retrieved: 2026-09-29, note: "Type first, color second."}
  - {id: bambu_wiki_purge_waste, title: "Handling purged filament waste", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/knowledge-sharing/handling-purged-filament-waste", retrieved: 2026-09-29}
  - {id: bambu_wiki_ams_no_unload, title: "AMS not unloading to save filament", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/manual/ams-not-unloading-to-save-filament", retrieved: 2026-09-29, note: "G-code edits that skip unload and flush between plates of the same filament. Risk of clog and lost RFID reads."}
  - {id: bambu_wiki_ams_humidity, title: "AMS humidity detection", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/ams/manual/humidity-detection-function", retrieved: 2026-09-29, note: "First generation AMS shows humidity as levels A to E, not a percentage."}
  # Wiki: nozzles
  - {id: bambu_wiki_hotend_x1, title: "Replace hotend (X1 and P1 series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/maintenance/replace-hotend", retrieved: 2026-09-29, note: "Hardened steel and stainless steel options in 0.2, 0.4, 0.6, 0.8 mm. Studio nozzle info is display only since Studio 02.01.01.52."}
  - {id: bambu_wiki_hotend_a1, title: "Replace hotend (A1 series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/a1/maintenance/replace-hotend", retrieved: 2026-09-29, note: "Toolless design, 0.2 to 0.8 mm plus a high flow hotend."}
  - {id: bambu_wiki_hotend_h2, title: "Replace hotend (H2 series)", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/h2/maintenance/replace-hotend", retrieved: 2026-09-29, note: "Nozzle info in Studio is display only; replace on the printer, then sync."}
  # Community tools
  - {id: ha_bambulab_docs, title: "ha-bambulab documentation", publisher: greghesp (community), type: community_docs, url: "https://github.com/greghesp/ha-bambulab/tree/main/docs", retrieved: 2026-09-29, note: "Overview and setup pages. MIT licensed Home Assistant integration installed through HACS."}
  - {id: orca_readme, title: "OrcaSlicer README", publisher: OrcaSlicer project, type: slicer_docs, url: "https://github.com/SoftFever/OrcaSlicer/blob/main/README.md", retrieved: 2026-09-29, note: "The Bambu networking plugin is optional and based on non-free BambuLab libraries."}
  - {id: bambuddy_repo, title: "Bambuddy", publisher: maziggy (community), type: community_repo, url: "https://github.com/maziggy/bambuddy", retrieved: 2026-09-29, note: "Self-hosted command center for Bambu printers. README warns that Studio Print on H2 series and P2S writes to internal storage that Bambuddy cannot read."}
  - {id: spoolman_repo, title: "Spoolman", publisher: Donkie (community), type: community_repo, url: "https://github.com/Donkie/Spoolman", retrieved: 2026-09-29, note: "Self-hosted filament inventory service."}
  - {id: bambu_spoolman_repo, title: "bambu-spoolman", publisher: mrkirby153 (community), type: community_repo, url: "https://github.com/mrkirby153/bambu-spoolman", retrieved: 2026-09-29, note: "Syncs per layer usage to Spoolman using the printer IP, serial and access code. Author lists LAN only prints and external spools as untested."}
  - {id: printago_bambu, title: "Bambu Lab print farm software", publisher: Printago, type: vendor_site, url: "https://printago.io/solutions/bambu-lab-farms", retrieved: 2026-09-29, note: "Connects through Bambu cloud or through the Fuse bridge in LAN plus Developer Mode. Vendor marketing, confidence medium."}
  - {id: tomshardware_bambu_farm_manager, title: "Bambu Lab introduces free software to manage an unlimited number of 3D printers", publisher: Tom's Hardware, type: news, url: "https://www.tomshardware.com/3d-printing/bambu-lab-introduces-free-software-to-manage-an-unlimited-number-of-3d-printers-simultaneously-cloud-free-lan-mode-print-farm-manager-program-simplifies-mass-3d-printing", retrieved: 2026-09-29, note: "Only the headline was readable: free, unlimited printers, cloud free LAN mode."}

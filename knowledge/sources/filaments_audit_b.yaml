kind: sources
sources:
  - {id: bambu_store_support_filaments, title: "Support for PA/PET (with Bambu support filament comparison table)", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/support-for-pa-pet", retrieved: 2026-09-29, note: "Comparison table of Support for PLA/PETG, PLA, ABS, PA/PET and PVA. Support for ABS: 240 to 270 C nozzle, 80 to 100 C bed, under 100 mm/s, limonene dissolvable, compatible with ABS. Support for PA/PET: 280 to 300 C nozzle, hardened steel, dry required, under 100 mm/s, for PAHT-CF, PA6-CF, PA6-GF and PET-CF. States that Support for PA/PET is discontinued and that Bambu ABS and ASA are the recommended alternatives."}
  - {id: bambu_store_support_for_abs, title: "Support for ABS", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/support-for-abs", retrieved: 2026-09-29, note: "Use for support only, enclosed printer required, drying optional, AMS 2 Pro, AMS HT and AMS compatible, AMS lite not compatible."}
  - {id: prusa_kb_drying, title: "Drying filament", publisher: Prusa Research, type: manufacturer_kb, url: "https://help.prusa3d.com/article/drying-filament_332086", retrieved: 2026-09-29, note: "Drying table: ASA 80 C for 4 h, PC Blend 85 C for 5 h, PC Blend Carbon Fiber 90 C for 4 h, PA11 Carbon Fiber 90 C for 6 h, PP carbon or glass fiber 70 C for 2 to 4 h. No row for unfilled PP, HIPS or BVOH."}
  - {id: cnckitchen_layer_height, title: "The influence of layer height on the strength of FDM 3D prints", publisher: CNC Kitchen, type: community_test, url: "https://www.cnckitchen.com/blog/the-influence-of-layer-height-on-the-strength-of-fdm-3d-prints", retrieved: 2026-09-29, note: "Prusament PLA, 0.4 mm nozzle, layer heights 0.05 to 0.4 mm. 0.15 mm strongest, strength suffers once layers exceed half the nozzle diameter, thin layers did not bond better. PLA only, so material specific use is an extrapolation."}
  - {id: materials_2018_pla_abs_fdm, title: "The Influence of Manufacturing Parameters on the Mechanical Behaviour of PLA and ABS Pieces Manufactured by FDM: A Comparative Analysis", publisher: Materials (MDPI), type: peer_reviewed, url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6119930/", retrieved: 2026-09-29, note: "For ABS the maximum tensile strength falls only 7.57 percent when layer height goes from 0.1 to 0.2 mm, less than for PLA. Infill percentage had the largest effect."}
  - {id: cnckitchen_cf_nylon_pa6_pa12, title: "Carbon Fiber Nylon in 3D Printing: PA6 vs PA12 Tested", publisher: CNC Kitchen, type: community_test, url: "https://www.cnckitchen.com/blog/carbon-fiber-nylon-in-3d-printing-pa6-vs-pa12-tested", retrieved: 2026-09-29, note: "Hardened steel nozzle needed, about 280 C. PA6 absorbs up to 3 percent water and PA12 up to 0.5 percent. After conditioning at 75 percent humidity PA6-CF kept 56 percent of its dry tensile strength and PA12-CF lost 15 percent. Prints flawlessly on open machines, a heated chamber reduces warping."}
  - {id: bcn3d_bvoh_page, title: "BVOH filament", publisher: BCN3D, type: manufacturer_store, url: "https://bcn3d.com/product/bvoh-bcn3d-filaments/", retrieved: 2026-09-29, note: "Compatible with PLA, Tough PLA, PETG, TPU 98A, ABS, PA and PAHT CF15. Nozzle 190 to 210 C, bed 45 to 90 C, speed 20 mm/s, fan 50 to 100 percent, dries in 4 to 16 h at 60 C, dissolves about twice as fast as PVA."}
  - {id: bcn3d_bvoh_vs_pva, title: "BVOH vs PVA", publisher: BCN3D, type: manufacturer_kb, url: "https://support.bcn3d.com/knowledge/bvoh-vs-pva", retrieved: 2026-09-29, note: "BVOH dissolves faster, leaves less residue, strings and under extrudes less than PVA, and pairs with more materials including ABS, PETG and nylon. Warm water speeds dissolving. Both need initial drying."}
  - {id: forward_am_bvoh, title: "Ultrafuse BVOH", publisher: Forward AM, type: manufacturer_tds, url: "https://forward-am.com/material-portfolio/ultrafuse-filaments-for-fused-filaments-fabrication-fff/support-filaments/ultrafuse-bvoh/", retrieved: 2026-09-29, note: "Nozzle 190 to 210 C, bed 60 to 100 C, 30 to 60 mm/s, nozzle 0.4 mm or larger, dissolves twice as fast as PVA, store sealed."}
  - {id: simplify3d_pp_guide, title: "Ultimate Materials Guide: 3D Printing with Polypropylene", publisher: Simplify3D, type: vendor_guide, url: "https://www.simplify3d.com/resources/materials-guide/polypropylene/", retrieved: 2026-09-29, note: "Bed 85 to 100 C, extruder 220 to 250 C, enclosure or chamber 45 to 60 C recommended, part cooling fan required, PP sticks well only to itself (PP tape or sheet), can warp heavily, lower temperature for the first layers so the part does not fuse to tape."}
  - {id: recreus_pp_adhesion, title: "Tips to improve adhesion when printing with PP3D", publisher: Recreus, type: manufacturer_kb, url: "https://recreus.com/en-en/blogs/learn-with-recreus-1/tips-improved-adhesion-when-printing-with-pp3d", retrieved: 2026-09-29, note: "For its PP filament: first layer height 0.15 mm, first layer 10 C above normal printing temperature, first layer line width plus 10 percent, use a brim."}
  - {id: flashforge_tds_hips, title: "HIPS Filament technical data sheet", publisher: Flashforge, type: manufacturer_tds, url: "https://after-support.flashforge.jp/uploads/datasheet/tds/HIPS_TDS_EN.pdf", retrieved: 2026-09-29, note: "Completely soluble in limonene, density 1.04 to 1.06 g/cm3, water absorption 1 percent in 24 h, HDT 88 C at 0.455 MPa. Test specimens printed at 230 C and 50 mm/s. No drying figure."}

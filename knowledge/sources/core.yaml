# Source registry shared by every knowledge file.
# A citation is either a source id from this directory ("bambu_wiki_material_table")
# or a prefixed path ("orca:OrcaFilamentLibrary/filament/Generic PETG @System.json"),
# expanded with the prefix url_template. Each area keeps its own file in
# knowledge/sources/ so writers do not collide; ids are unique across all files.
kind: sources
prefixes:
  - prefix: orca
    title: OrcaSlicer bundled printer, process and filament profiles
    publisher: OrcaSlicer project
    type: slicer_profile
    url_template: "https://github.com/SoftFever/OrcaSlicer/blob/7d42ad17a45c1c44d07f382f14244223565e9cb8/resources/profiles/{path}"
    retrieved: 2026-09-29
    note: "Values read with inheritance resolved. Bambu per printer overrides live in files named '@BBL <printer>'. List values in newer profiles follow filament_extruder_variant order: Direct Drive Standard, Direct Drive High Flow, Direct Drive Extra High Flow, Bowden Standard, Bowden High Flow, Bowden Extra High Flow."
  - prefix: orca_src
    title: OrcaSlicer source code
    publisher: OrcaSlicer project
    type: slicer_source
    url_template: "https://github.com/SoftFever/OrcaSlicer/blob/7d42ad17a45c1c44d07f382f14244223565e9cb8/{path}"
    retrieved: 2026-09-29
sources:
  - id: bambu_wiki_material_table
    title: "Filament guide: printer, nozzle, AMS and plate compatibility, drying and glue tables"
    publisher: Bambu Lab
    type: manufacturer_wiki
    url: https://wiki.bambulab.com/en/general/filament-guide-material-table
    retrieved: 2026-09-29
    note: "Nozzle temperature column is stated as plus or minus 10 C. Relative star ratings for heat deflection, impact and tensile strength."
  - id: bambu_wiki_drying
    title: "Filament drying recommendations"
    publisher: Bambu Lab
    type: manufacturer_wiki
    url: https://wiki.bambulab.com/en/filament-acc/filament/dry-filament
    retrieved: 2026-09-29
    note: "Appendix I table: bed drying, forced air oven, AMS 2 Pro and AMS HT temperatures and times. AMS 2 Pro drying tops out at 65 C."
  - id: prusa_kb_petg
    title: "PETG"
    publisher: Prusa Research
    type: manufacturer_kb
    url: https://help.prusa3d.com/article/petg_2059
    retrieved: 2026-09-29
  - id: klipper_pressure_advance
    title: "Pressure advance"
    publisher: Klipper project
    type: firmware_docs
    url: https://www.klipper3d.org/Pressure_Advance.html
    retrieved: 2026-09-29
    note: "Typical values 0.050 to 1.000, high end usually only with bowden. Tuning tower factor 0.005 direct drive, 0.020 bowden. Suggests a small slicer retract such as 0.75 mm after tuning."
  - id: ellis_pa
    title: "Ellis' Print Tuning Guide: pressure and linear advance"
    publisher: Ellis3DP (community)
    type: community_guide
    url: https://ellis3dp.com/Print-Tuning-Guide/articles/pressure_linear_advance/introduction.html
    retrieved: 2026-09-29
    note: "PA changes with filament brand, nozzle size, large temperature changes, input shaper on or off, and hotend or extruder changes. Calibrate extruder first."
  - id: orca_wiki_calibration
    title: "OrcaSlicer calibration tests"
    publisher: OrcaSlicer project
    type: slicer_docs
    url: https://github.com/SoftFever/OrcaSlicer/wiki/Calibration
    retrieved: 2026-09-29
    note: "Tests: temperature, volumetric speed, pressure advance (and adaptive PA), flow ratio, retraction, tolerance, cornering, input shaping, VFA."
  - id: prusa_kb_food_safe
    title: "Food safe FDM printing"
    publisher: Prusa Research
    type: manufacturer_kb
    url: https://help.prusa3d.com/article/food-safe-fdm-printing_112313
    retrieved: 2026-09-29
    note: "Layer grooves harbor bacteria; brass nozzles contain about 2 percent lead; Prusa does not recommend prints as food containers without a food safe coating and a stainless nozzle."
  - id: prusa_kb_bed_thermal_runaway
    title: "Bed thermal runaway"
    publisher: Prusa Research
    type: manufacturer_kb
    url: https://help.prusa3d.com/article/bed-thermal-runaway-31203-core-one-35203-core-one-l-36203-core-one-indx-26203-mk4s-13203-mk4-27203-mk3-9s-21203-mk3-9-28203-mk3-5s-23203-mk3-5_401068
    retrieved: 2026-10-13
    note: "If the heatbed temperature drops by more than 2 C for over 60 seconds, the printer stops the print and shows the Thermal Runaway error."
  - id: bambu_a1_recall
    title: "Bambu Lab recalls A1 3D printers"
    publisher: Bambu Lab
    type: manufacturer_notice
    url: https://bambulab.com/de-de/support/A1recall
    retrieved: 2026-10-13
    note: "A1 printers sold before January 30, 2024 (sixth serial digit A): the heatbed cable can be damaged when bent, with a risk of short circuit, shock or fire. Refund or heatbed and cable replacement."
  - id: slicerx_app_paint
    title: "SlicerX Paint tool (plate toolbar and Paint panel)"
    publisher: SlicerX
    type: app_source
    url: https://github.com/slicerx-oss/slicerx/blob/main/packages/app/src/workspaces/prepare/paint-panel.tsx
    retrieved: 2026-10-13
    note: "Paint layers Color, Seam, Support, Fuzzy skin; brushes Brush, Fill, Height, with Triangle and Gap fill under More; color slots come from the Filament block."
  - id: snapmaker_blog_threads
    title: "Guide to Designing and 3D Printing Threads"
    publisher: Snapmaker
    type: manufacturer_blog
    url: https://blog.snapmaker.com/blog/3d-printing-threads/
    retrieved: 2026-10-13
    note: "Stand threaded parts upright; 0.16 mm layers or better 0.12 mm; ACME or trapezoidal over V threads; small negative offset on the male thread; test with an M10 or M12 nut and bolt; heat-set inserts for strong or reused threads. No numeric clearance."
  - id: prusa_store_heat_set_inserts
    title: "Heat set inserts M4 standard (50 pcs)"
    publisher: Prusa Research
    type: manufacturer_store
    url: https://www.prusa3d.com/en/product/heat-set-inserts-m4-standard-50-pcs/
    retrieved: 2026-10-13
    note: "Page text, fetched 2026-10-13: 'Installation temperature is the printing temperature +10 °C'; 'use the print temperature for the specific filament that was used to print the plastic part increased by 10°C - 20°C'; 'The printed plastic will melt and reflow around the knurled external surface.'"
  - id: prusa_kb_modeling
    title: "Modeling with 3D printing in mind"
    publisher: Prusa Research
    type: manufacturer_kb
    url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
    retrieved: 2026-10-13
    note: "Tolerances: 'You will probably not be able to slot together two parts with zero-tolerance dimensions.' No universal value; depends on size, orientation, geometry, calibration, settings and material. 'An Original Prusa will be accurate to at least 0.2 mm'; 'An initial good measurement for movable parts is at least 0.3 mm.' No press fit figure."
  - id: bambu_wiki_a1_maintenance
    title: "A1 basic maintenance"
    publisher: Bambu Lab
    type: manufacturer_wiki
    url: https://wiki.bambulab.com/en/a1/maintenance/basic-maintenance
    retrieved: 2026-10-13
    note: "All-metal rails. X and Y rails monthly: tweezers, dust-free cloth, lubricant oil; 'strictly prohibited to use lubricating grease on the X-axis linear rail'. Lead screws grease every 3 months; X and Y idler pulleys oil every 3 months; cooling fans weekly; extruder gear and nozzle every 5 spools, 2 for carbon fiber."
  - id: prusa_kb_cooling
    title: "Cooling"
    publisher: Prusa Research
    type: manufacturer_kb
    url: https://help.prusa3d.com/article/cooling_127569
    retrieved: 2026-10-13
    note: "Max fan speed 'will be used when the layer print time is below the Slow down if layer print time is below value'; that setting slows the print 'to extend the duration to this value'. Raising the minimum print speed too high 'may partially invalidate the minimum layer time'."

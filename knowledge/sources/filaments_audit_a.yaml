kind: sources
sources:
  - {id: bambu_tds_pla_basic_v3, title: "Bambu Filament Technical Data Sheet V3.0 PLA Basic", publisher: Bambu Lab, type: manufacturer_tds, url: "https://wiki.bambulab.com/filament-acc/abs-asa-pc/bambu_pla_basic_technical_data_sheet.pdf", retrieved: 2026-09-29, note: "Printing speed under 300 mm/s, nozzle 190 to 230 C, bed 35 to 45 C, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, support material Support for PLA."}
  - {id: bambu_tds_pla_silk_v3, title: "Bambu Filament Technical Data Sheet V3.0 PLA Silk", publisher: Bambu Lab, type: manufacturer_tds, url: "https://sourcegraphics.com/wp-content/uploads/2023/10/Bambu_PLA_Silk_Technical_Data_Sheet_.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 250 mm/s, nozzle 210 to 240 C, bed 35 to 45 C, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, max overhang 55 degrees, support Support for PLA, nozzle sizes 0.2 to 0.8 mm."}
  - {id: bambu_tds_pla_matte_v2, title: "Bambu Filament Technical Data Sheet V2.0 PLA Matte", publisher: Bambu Lab, type: manufacturer_tds, url: "https://www.impresoras3d.com/wp-content/uploads/2023/08/TDS-Bambu-PLA-Matte-Technical-Data-Sheet.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 300 mm/s, nozzle 190 to 230 C, bed 35 to 45 C, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, support Support for PLA."}
  - {id: bambu_tds_pla_cf, title: "Bambu Filament Technical Data Sheet PLA-CF (V2.0 and V3.0)", publisher: Bambu Lab, type: manufacturer_tds, url: "https://store.bblcdn.eu/s8/default/aefa8303ad8d40248b0d86dfdad46518/Bambu_PLA-CF_Technical_Data_Sheet_V3.pdf", retrieved: 2026-09-29, note: "Printing speed under 200 mm/s, nozzle 210 to 240 C, bed 35 to 45 C, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, support Support for PLA, nozzle sizes 0.4 to 0.8 mm."}
  - {id: bambu_tds_petg_basic_v3, title: "Bambu Filament Technical Data Sheet V3.0 PETG Basic", publisher: Bambu Lab, type: manufacturer_tds, url: "https://store.bblcdn.com/s1/default/cb94589bf7994fdcbfa833badefae9cd/Bambu_PETG_Basic_Technical_Data_Sheet.pdf", retrieved: 2026-09-29, note: "Printing speed under 200 mm/s, nozzle 230 to 260 C, bed 65 to 75 C, retraction 0.4 to 0.8 mm at 30 to 60 mm/s, glue stick recommended, support Support for PLA/PETG."}
  - {id: bambu_tds_petg_hf_v1, title: "Bambu Filament Technical Data Sheet V1.0 PETG HF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://www.additive-x.com/shop/pub/media/mageplaza/product_attachments/attachment_file/b/a/bambu_petg_hf_technical_data_sheet.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 300 mm/s, cooling fan 0 to 60 percent, retraction 0.8 to 1.4 mm at 30 to 60 mm/s, chamber 35 to 50 C."}
  - {id: bambu_tds_petg_cf_v2, title: "Bambu Filament Technical Data Sheet V2.0 PETG-CF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://www.additive-x.com/shop/media/mageplaza/product_attachments/attachment_file/b/a/bambu_petg-cf-technical_data_sheet.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 200 mm/s, cooling fan 100 percent, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, nozzle 240 to 270 C, no support material listed."}
  - {id: bambu_tds_petg_cf_v3, title: "Bambu Filament Technical Data Sheet V3.0 PETG-CF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://3d.nice-cdn.com/upload/file/Bambu_PETG-CF_Technical_Data_Sheet_V2.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 200 mm/s, cooling fan 0 to 60 percent, retraction 0.8 to 1.4 mm at 30 to 60 mm/s, chamber 35 to 50 C, nozzle sizes 0.4 to 0.8 mm, support turned on."}
  - {id: bambu_tds_tpu_95a, title: "Bambu Filament Technical Data Sheet V2.0 TPU 95A", publisher: Bambu Lab, type: manufacturer_tds, url: "https://sourcegraphics.com/wp-content/uploads/2023/06/Bambu_TPU_95A_Technical_Data_Sheet.pdf", retrieved: 2026-09-29, note: "Reseller copy of the maker PDF. Printing speed under 80 mm/s, cooling fan 100 percent, bed 30 to 35 C, retraction 0.8 to 1.4 mm at 20 to 40 mm/s, test speed 80 mm/s."}
  - {id: bambu_tds_tpu_95a_hf, title: "Bambu Filament Technical Data Sheet V1.0 TPU 95A HF", publisher: Bambu Lab, type: manufacturer_tds, url: "https://store.bblcdn.eu/s8/default/16df21baf482453999b3dbb61cc110e7/Bambu_TPU_95A_HF_Technical_Data_Sheet.pdf", retrieved: 2026-09-29, note: "Printing speed under 200 mm/s, retraction 0.8 to 1.4 mm at 20 to 40 mm/s, bed 30 to 35 C, nozzle sizes 0.4 to 0.8 mm, test speed 140 mm/s."}
  - {id: bambu_tds_support_pla_petg_v1, title: "Bambu Filament Technical Data Sheet V1.0 Support for PLA/PETG", publisher: Bambu Lab, type: manufacturer_tds, url: "https://store.bblcdn.eu/s8/default/1f4a4af9a2624468b412f4bee647408a/Bambu_Support_for_PLA_PETG_Technical_Data_Sheet.pdf", retrieved: 2026-09-29, note: "Printing speed under 100 mm/s, nozzle 190 to 240 C, bed 35 to 60 C, retraction 0.6 to 1.0 mm at 20 to 40 mm/s, max overhang 55 degrees, bridging about 30 mm."}
  - {id: bambu_wiki_pla_silk_guide, title: "Bambu PLA Silk / Silk+ filament printing guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/x1/manual/printing-with-silk-filaments", retrieved: 2026-09-29, note: "Outer wall 40 to 60 mm/s (try 50), Don't slow down outer walls with Consistent Surface cooling logic, layer height 0.16 mm, 235 C, print display surface upright, 0.2 and 0.4 mm nozzles only, SuperTack not recommended, top surface pattern Archimedean chords or concentric."}
  - {id: bambu_wiki_different_gloss, title: "Variation in print shine and gloss", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/print-quality/different-gloss", retrieved: 2026-09-29, note: "Gloss changes with speed, temperature, layer height, minimum layer time and cooling. Use 0.16 mm layers, keep outer wall speed close to the slowest speed on the speed graph, fish scale effect at 0.08 mm and high speed (use 0.12 to 0.20 mm, cut speed 20 to 30 percent, add 5 to 10 C)."}
  - {id: bambu_wiki_adaptive_layer, title: "Variable layer height", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/software/bambu-studio/adaptive-layer-height", retrieved: 2026-09-29, note: "Height range for a 0.4 mm nozzle is 0.08 to 0.28 mm, tested by Bambu for good quality. Adaptive mode slides between detail and speed and puts low layers where surfaces are shallow."}
  - {id: bambu_wiki_pla_petg_mutual_support, title: "Printing guide for using PLA Basic and PETG HF or PETG Basic for support", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament-acc/filament/h2d-pla-and-petg-mutual-support", retrieved: 2026-09-29, note: "PETG supports on a PETG model bond harder and are harder to remove. PLA Basic interface under PETG breaks away clean. Use only as interface, zero Z gap, PLA at 230 C, PETG support at 265 C and 10 mm3/s. Not for PLA Matte, Silk, PLA-CF, PETG Translucent or PETG-CF."}
  - {id: bambu_wiki_petg_guide, title: "PETG usage guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament/petg", retrieved: 2026-09-29, note: "Flow ratio 0.93 to 0.96, keep walls at 6 or fewer and infill at 50 percent or less, more walls and infill raise warping risk, glue or brim for adhesion, PVA not compatible as support for PETG, use Support for PLA/PETG."}
  - {id: bambu_wiki_support_filament_guide, title: "Support filament usage guide", publisher: Bambu Lab, type: manufacturer_wiki, url: "https://wiki.bambulab.com/en/filament/support", retrieved: 2026-09-29, note: "Support filaments allow zero gap contact between support and model. Match the support filament to the model filament. PVA is not compatible as support for PETG. Water soluble support is not recommended on A series."}
  - {id: bambu_store_petg_cf, title: "PETG-CF product page", publisher: Bambu Lab, type: manufacturer_store, url: "https://us.store.bambulab.com/products/petg-cf", retrieved: 2026-09-29, note: "Page blocked direct fetch. Content seen through a search excerpt only: 0.6 mm hardened nozzle recommended over 0.4 mm, layer height 0.2 mm with a range of 0.12 to 0.28 mm. Low confidence."}
